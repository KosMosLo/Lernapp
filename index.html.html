"sett":[
["Nenne die Pflegesettings und je ein Merkmal.","Akutpflege: kurze Verweildauer, hohe Taktung. Kurzzeitpflege: befristet, Übergang (§ 42 SGB XI). Langzeitpflege: Wohnen, Beziehung und Lebensqualität. Ambulante Pflege: Gast im Haushalt, Touren, Zusammenspiel von SGB V und SGB XI.",["akut","kurzzeit|42","langzeit","ambulant","gast"]],
["Fall: Herr Wolf, 80, wird nach einem Oberschenkelhalsbruch aus der Klinik entlassen. Er möchte nach Hause, braucht aber noch Unterstützung. Welche Versorgungsformen kommen infrage?","Ich beziehe das Entlassmanagement ein (§ 39 SGB V). Möglich sind Kurzzeitpflege als Übergang, ein ambulanter Pflegedienst, Pflegeberatung (§ 7a SGB XI), Hilfsmittel und ggf. Reha. Ich weise auf den Antrag auf Pflegegrad hin und beziehe Angehörige ein.",["entlassmanagement|39","kurzzeitpflege","ambulant","pflegegrad|antrag","hilfsmittel","beratung|7a"]]
],
"team":[
["Unterscheide interdisziplinäre und intradisziplinäre Zusammenarbeit und nenne Instrumente.","Interdisziplinär: zwischen verschiedenen Berufsgruppen wie Pflege, Medizin, Physiotherapie. Intradisziplinär: innerhalb der Pflege, z. B. Fachperson, Assistenz, Praxisanleitung. Instrumente: Übergabe mit SBAR, Visite, Fallbesprechung, Entlassmanagement.",["interdisziplin","intradisziplin","sbar|ubergabe","visite","fallbesprechung"]],
["Fall: In deinem Team gibt es Dauerstreit zwischen Früh- und Spätdienst wegen unvollständiger Übergaben. Was tust du?","Ich spreche das Thema sachlich mit Ich-Botschaften an und nenne konkretes Verhalten. Ich schlage eine strukturierte Übergabe mit SBAR vor, kläre Regeln im Teamgespräch und beziehe bei Bedarf die Leitung ein. Vereinbarungen halten wir fest und prüfen sie später.",["ich-botschaft|ich botschaft|sachlich","sbar|struktur","spreche|ansprech","teambesprechung|teamgesprach|leitung","regel|standard"]]
],
"bel":[
["Welche Belastungen gibt es im Pflegeberuf und welche Ressourcen helfen?","Körperlich: Heben und Tragen, Schichtdienst. Psychisch: Tod, Zeitdruck, Konflikte, Gewalt. Ressourcen: Teamunterstützung, Supervision, kollegiale Beratung, verlässliche Dienstpläne, rückenschonendes Arbeiten. Arbeitgeber müssen Gefährdungen beurteilen, auch psychische.",["korperlich|heben","psychisch","schicht","supervision","kollegial","dienstplan","gefahrdung|gefahrdungsbeurteilung|arbeitsschutz"]],
["Fall: Eine Kollegin wirkt seit Wochen erschöpft, zynisch gegenüber Patienten und fehlt oft. Wie reagierst du?","Ich spreche sie wertschätzend und unter vier Augen an und beschreibe meine Beobachtung, ohne zu bewerten. Ich frage nach ihrer Situation und weise auf Hilfen wie Supervision, Betriebsarzt oder Beratung hin. Bei Bedarf informiere ich die Leitung, die für Entlastung und Gefährdungsbeurteilung zuständig ist.",["beobacht|burnout","spreche|ansprech|gesprach","leitung","supervision|betriebsarzt","ressourcen|entlast","nicht bewert|wertschatz"]]
],
"ausl":[
["Wie läuft die Anerkennung einer ausländischen Pflegeausbildung ab?","Es erfolgt eine Gleichwertigkeitsprüfung. Bei wesentlichen Unterschieden gibt es eine Anpassungsmaßnahme oder Kenntnisprüfung. Voraussetzung ist in der Regel Sprachniveau B2 plus Fachsprache. Regeln können je nach Land abweichen.",["gleichwertigkeit","anpassung|kenntnispruf","b2|sprache","defizit|unterschied"]],
["Fall: Eine neue Kollegin aus dem Ausland hat Sprachprobleme in der Übergabe. Wie unterstützt du die Integration?","Ich biete Mentoring und eine strukturierte Einarbeitung an, spreche langsam und klar und erkläre Fachbegriffe. Ich zeige Wertschätzung, gebe Zeit und beziehe das Team ein. Bei Bedarf unterstütze ich Sprachförderung. Wichtig ist, dass sie nicht überfordert wird.",["mentor","einarbeitung","sprech|sprache|fachsprache","wertschatz|respekt","team","zeit|geduld"]]
],
"pflbg":[
["Welche vorbehaltenen Aufgaben nennt § 4 PflBG?","Nach § 4 Abs. 2 PflBG sind vorbehalten: die Erhebung und Feststellung des individuellen Pflegebedarfs, die Organisation, Gestaltung und Steuerung des Pflegeprozesses sowie die Analyse, Evaluation, Sicherung und Entwicklung der Pflegequalität.",["bedarf|erhebung","gestaltung|planung","pflegeprozess|steuer","qualitat","4"]],
["Fall: Eine Pflegeassistentin soll die Pflegeplanung für einen neu aufgenommenen Bewohner erstellen. Darfst du das zulassen?","Nein. Die Planung und Steuerung des Pflegeprozesses ist eine vorbehaltene Aufgabe und darf nicht an Personen ohne Erlaubnis übertragen werden. Die Pflegefachperson bleibt verantwortlich. Die Assistenz kann zuarbeiten, z. B. Informationen sammeln oder Maßnahmen durchführen, unter Anleitung und Kontrolle.",["vorbehalt","pflegefachperson","nicht ubertragen|ubertragen|nicht delegier","assistenz","verantwortlich|verantwortung"]]

["Erkläre, wie ein Dekubitus entsteht und wie du ihn verhinderst.","Ein Dekubitus entsteht, wenn anhaltender Druck (und Scherkräfte) die Durchblutung der Haut stoppt, sodass Gewebe ohne Sauerstoff abstirbt. Ich schätze das Risiko ein, inspiziere täglich die Haut, entlaste Druck (30°-Schräglage, Fersen frei lagern, geeignete Matratze), fördere Bewegung, schütze die Haut und berate. Gerötete Stellen massiere ich nicht. Die Wirkung überprüfe ich.",["druck","durchblutung","risiko","haut","lager|entlast","mobilis|bewegung","massier"]],
["Fall: Frau S., 85, nach Schenkelhalsbruch, bettlägerig, Kreuzbein nicht wegdrückbar gerötet. Was tust du?","Das ist ein Dekubitus Kategorie 1. Ich entlaste das Kreuzbein sofort (Schräglage, keine Rückenlage), dokumentiere Befund und Größe, informiere die Pflegeplanung und ggf. den Arzt, nutze geeignete Auflagen, fördere Bewegung, beobachte die Haut und passe die Planung an. Ich massiere nicht.",["kategorie 1|nicht wegdruck","entlast|schraglage","dokument","arzt","auflage|matratze","massier"]]

"div":[
["Erkläre Entstehung, Symptome und Gefahren der Divertikulitis.","Durch Druck im Darm (wenig Ballaststoffe, Verstopfung) entstehen Ausstülpungen (Divertikulose). Entzünden sie sich, entsteht die Divertikulitis, meist im Sigma. Symptome: Schmerz links unten, Fieber, erhöhte Entzündungswerte, Stuhlveränderung. Gefahren: Abszess, Perforation, Peritonitis. Alarmzeichen sind bretthartes Abdomen, hohes Fieber und Kreislaufinstabilität.",["sigma","linker unterbauch|links","fieber","perforation|peritonitis","ballaststoff","abszess"]],
["Fall: Herr T. hat Divertikulitis, plötzlich starke Bauchschmerzen, bretthartes Abdomen, Puls 120. Was tust du?","Verdacht auf Perforation mit Peritonitis, ein Notfall. Ich informiere sofort die ärztliche Person, kontrolliere Vitalzeichen, lagere nach Befinden, beachte Nahrungskarenz und bereite nach Anordnung Infusion und OP vor. Ich gebe keine Abführmittel und dokumentiere.",["perforation|peritonitis","arzt","vitalzeichen","nahrungskarenz|nuchtern","abfuhr","dokument"]]
],
"stoma":[
["Erkläre die Stomaarten und die Pflegeaufgaben.","Ileostoma (Dünndarm): flüssiger, hautaggressiver Stuhl, Dehydratationsgefahr. Colostoma (Dickdarm): geformterer Stuhl. Urostoma: Urinableitung. Pflege: passende Platte, Hautschutz, Beobachtung der Durchblutung (rosig-rot), Beratung, Stomatherapeut einbeziehen, Selbstversorgung anleiten, Körperbild und Sexualität ansprechen.",["ileostoma","colostoma|kolostoma","urostoma","hautschutz|haut","rosig|durchblutung","beratung|anleitung"]],
["Fall: Das Stoma von Frau R. ist seit heute bläulich-schwarz. Was tust du?","Das ist ein Warnzeichen für Minderdurchblutung bis Nekrose. Ich informiere sofort die ärztliche Person, beobachte Vitalzeichen und Schmerzen, dokumentiere Befund und Zeitpunkt und kontrolliere, ob die Versorgung zu eng sitzt.",["nekrose|durchblutung","arzt","dokument","vitalzeichen","zu eng|platte"]]
],
"zvk":[
["Erkläre die Risiken und Pflegeaufgaben beim ZVK.","Der ZVK verbindet Außenwelt und Blutbahn, daher Infektions- und Sepsisgefahr, Thrombose, Luftembolie, Fehllage. Pflege: Händedesinfektion, aseptisches Arbeiten, Konnektoren desinfizieren, sauberer Verband, Einstichstelle beobachten, Lage vor Nutzung kontrollieren, auf Zeichen wie Rötung, Fieber, Armschwellung achten.",["infektion|sepsis","thrombose","luftembolie","fehllage|lage","desinfekt","aseptisch","einstichstelle"]],
["Fall: Herr B. mit Sondenkost hustet plötzlich beim Laufen der Kost und hat Atemnot. Was tust du?","Ich stoppe sofort die Kostzufuhr, setze den Oberkörper hoch, ermutige zum Abhusten, kontrolliere Atmung und Vitalzeichen und informiere die ärztliche Person (Verdacht Aspiration). Ich dokumentiere und prüfe Lage der Sonde und Positionierung.",["stopp|unterbrech","oberkorper","aspiration","arzt","vitalzeichen","dokument"]]
],
"cu":[
["Erkläre die Colitis ulcerosa und grenze sie vom Morbus Crohn ab.","Colitis ulcerosa: chronisch-entzündliche Darmerkrankung, beginnt im Rektum, kontinuierlicher Befall, nur Dickdarm, nur Schleimhaut. Symptome im Schub: blutig-schleimige Durchfälle, Tenesmen, Bauchschmerz. Crohn: gesamter Verdauungstrakt, segmental, alle Wandschichten. Komplikationen: toxisches Megakolon, erhöhtes Darmkrebsrisiko.",["rektum","kontinuierlich","dickdarm","schleimhaut","crohn","segmental","blutig"]],
["Fall: Ein CU-Patient hat Fieber, aufgetriebenen Bauch und Kreislaufprobleme. Was tust du?","Ich denke an ein toxisches Megakolon, ein Notfall. Ich informiere sofort die ärztliche Person, überwache Vitalzeichen und Flüssigkeitsbilanz, beachte Nahrungskarenz nach Anordnung und bereite weitere Diagnostik vor.",["megakolon","arzt","vitalzeichen","bilanz","notfall"]]
],
"kult":[
["Was bedeutet kultursensible Pflege und wie setzt du sie um?","Kultursensible Pflege heißt, Menschen individuell mit ihren Werten, Religion, Sprache und Bedürfnissen wahrzunehmen, ohne sie in Schubladen zu stecken. Ich frage nach, reflektiere eigene Vorurteile, setze professionelle Sprachmittlung ein, berücksichtige Ernährung, Schamgefühl, Rituale und Familie. Modell: Sunrise-Modell von Leininger.",["individuell|erfrag","vorurteil|reflek","dolmetsch|sprachmittl","ernahrung|religion","leininger|sunrise","stereotyp|schublade"]],
["Fall: Ein Patient lehnt Schweinefleisch ab und möchte während des Ramadan fasten, nimmt aber Insulin. Was tust du?","Ich spreche respektvoll mit ihm, kläre Wünsche und Risiken und beziehe die ärztliche Person ein, um Insulin und Essenszeiten individuell anzupassen. Ich ändere die Menüwahl nach seinen Wünschen und dokumentiere. Entscheidung bleibt bei ihm.",["respekt|gesprach","arzt","insulin","wunsch|bedurfnis","dokument","entscheidung"]]
],
"copd":[
["Erkläre die COPD und die wichtigsten Pflegemaßnahmen.","COPD ist eine chronische, nicht vollständig reversible Atemwegsobstruktion mit Atemnot, Husten und Auswurf, meist durch Rauchen. Diagnose per Spirometrie. Pflege: Lippenbremse, Kutschersitz, Oberkörper hoch, Inhalationstechnik prüfen, Sauerstoff nur nach Anordnung, Impfungen, Rauchstopp.",["obstruktion","atemnot","spirometrie","lippenbremse","kutscher","sauerstoff","rauch"]],
["Fall: Ein COPD-Patient unter Sauerstoff wird müde, hat Kopfschmerz und ist verwirrt. Was tust du?","Verdacht auf CO2-Retention. Ich erhöhe den Sauerstoff nicht eigenmächtig, sondern informiere sofort die ärztliche Person, kontrolliere Vitalzeichen und Bewusstsein und lagere mit erhöhtem Oberkörper.",["co2|retention","arzt","nicht eigenmachtig|nicht erhoh","vitalzeichen","oberkorper"]]
],
"hilf":[
["Wer finanziert Hilfsmittel und Pflegehilfsmittel und wie läuft der Ablauf?","Die Krankenkasse zahlt Hilfsmittel zur Behandlung oder zum Behinderungsausgleich nach ärztlicher Verordnung (§ 33 SGB V). Die Pflegekasse zahlt Pflegehilfsmittel zur Erleichterung der Pflege bei Pflegegrad (§ 40 SGB XI). Ablauf: Bedarf erheben, Verordnung/Antrag, Bewilligung, Einweisung, Kontrolle. Bei Ablehnung ist Widerspruch möglich.",["33","40","krankenkasse","pflegekasse","verordnung|antrag","widerspruch","pflegegrad"]],
["Fall: Eine Familie pflegt die Mutter zu Hause, sie braucht ein Pflegebett und Bettschutzeinlagen. Wie berätst du?","Ich kläre Pflegegrad, erkläre, dass Pflegebett und Hausnotruf technische Pflegehilfsmittel sind und Bettschutz ein zum Verbrauch bestimmtes Pflegehilfsmittel; Antrag bei der Pflegekasse. Ich weise auf Pflegeberatung (§ 7a SGB XI) hin und auf den Widerspruch bei Ablehnung.",["pflegegrad","pflegekasse","pflegebett|technisch","verbrauch|bettschutz","antrag","7a|beratung","widerspruch"]]
],
"pp":[
["Erkläre den Pflegeprozess nach Fiechter und Meier.","Der Pflegeprozess hat sechs Schritte: Informationen sammeln, Probleme und Ressourcen erkennen, Pflegeziele festlegen, Maßnahmen planen, durchführen und evaluieren. Er ist ein Regelkreis, die Evaluation führt zurück in die Planung. Ziele sind konkret, realistisch, überprüfbar, mit Zeitpunkt und mit der Person vereinbart.",["sechs|6","information","problem","ressource","ziel","planung|plan","durchfuhr","evaluation","regelkreis"]],
["Fall: Herr K. nach Schlaganfall, rechtsseitige Schwäche, möchte selbst essen. Formuliere Problem, Ziel und Maßnahme.","Problem (PES): Beeinträchtigte Selbstständigkeit beim Essen durch rechtsseitige Schwäche, erkennbar an Kleckern und Müdigkeit. Ressource: motiviert. Ziel: Herr K. isst bis Freitag mit Anpassungshilfen selbstständig die Hälfte der Mahlzeit. Maßnahme: Pflegefachperson richtet Hilfsmittel her, begleitet das Essen täglich, lobt, dokumentiert. Evaluation am Freitag.",["problem","durch|ursache","erkennbar|symptom","ressource","ziel","bis freitag|zeitpunkt","massnahme","evaluation"]]

"infos":[
["Wie sammelst du Informationen und was ist das Strukturmodell?","Quellen sind Betroffene, Angehörige, Akten, Beobachtung und Assessments. Ich trenne objektive (messbare) und subjektive (Empfinden) Daten. Das Strukturmodell (SIS) fragt zuerst die Sicht der Person und ordnet danach in sechs Themenfelder, z. B. Mobilität, Selbstversorgung, Kognition und Kommunikation. Datenschutz und Aktualität beachten.",["objektiv","subjektiv","angehorig|akte","assessment","sis|strukturmodell","themenfeld|sechs","datenschutz"]],
["Fall: Bei Herrn P., 82, wird ein Sturzrisiko vermutet. Welche Informationen und Assessments nutzt du?","Ich frage Herrn P. zu Stürzen, Schwindel, Medikamenten, Sehen und Gewohnheiten, beobachte Gang und Umgebung und nutze Assessments wie Timed Up and Go oder Sturzrisikoeinschätzung. Angehörige und Akte ergänzen. Daten dokumentiere ich objektiv.",["sturz","medikament","gang|mobilit","assessment|timed","angehorig","dokument"]]

"schm":[
["Erkläre, wie Schmerz erfasst und behandelt wird.","Ich erfasse Ort, Qualität, Intensität (NRS/VAS), Verlauf, Auslöser und Auswirkungen. Bei Demenz nutze ich Beobachtungsinstrumente wie BESD. Therapie nach WHO-Stufenschema nach ärztlicher Anordnung, nach Uhrzeit, Nebenwirkungen vorbeugen (z. B. Obstipation), dazu nicht-medikamentöse Maßnahmen. Wirkung kontrollieren und dokumentieren.",["nrs|vas","besd","who","uhrzeit","nebenwirkung|obstipation","nicht-medikamentos|lagerung|warme","dokument"]],
["Fall: Frau L., 88, Demenz, stöhnt beim Waschen und wehrt ab. Was tust du?","Ich vermute Schmerz, nutze BESD zur Fremdeinschätzung, beobachte Mimik, Lautäußerung und Körpersprache, informiere die ärztliche Person und setze angeordnete Maßnahmen um. Zusätzlich passe ich Lagerung und Pflegeablauf an und dokumentiere.",["schmerz","besd","mimik|korpersprache","arzt","lagerung","dokument"]]

"lung":[
["Erkläre das Lungenkarzinom und was Palliative Care bedeutet.","Es gibt kleinzellige und nicht-kleinzellige Karzinome, Hauptrisiko ist Rauchen. Symptome: Husten, Blut im Auswurf, Atemnot, Gewichtsverlust. Palliative Care lindert Symptome, stärkt Lebensqualität und bezieht Angehörige ein, ganzheitlich und interprofessionell, früh im Verlauf.",["kleinzellig","rauchen","husten","atemnot","palliative|lebensqualit","angehorig","interprofession"]],
["Fall: Herr M., Lungenkarzinom, starke Atemnot und Angst. Was tust du?","Ich lagere den Oberkörper hoch, bleibe bei ihm, sorge für Ruhe und frische Luft und nehme Angst ernst. Medikamente zur Linderung gebe ich nur nach ärztlicher Anordnung. Ich dokumentiere und beziehe Angehörige ein; Patientenverfügung und SAPV spreche ich an.",["oberkorper","ruhe|anwesenheit","luft","anordnung|arzt","angehorig","patientenverfugung|sapv"]]

["Fall: Ein Patient soll zu Hause Insulin spritzen. Wie gehst du vor?","Ich kläre Wissen und Ängste, erkläre Wirkung und Risiken (Information), zeige die Technik und übe mit ihm (Anleitung), nutze Teach-back, dokumentiere und biete Wiederholung und ggf. Schulung an. Spritzstellen wechseln, Hypoglykämie erkennen.",["information","anleitung|ubung|ueben","teach","dokument","spritzstelle","hypoglyk|unterzucker"]]

function sched(){var D1=864e5,sM=pd(S.s),W=pd(S.w),W2=pd(S.w2||S.w),O=pd(S.o),SL=C.filter(function(t){return t[1].indexOf('S')>-1}),ML=C.filter(function(t){return t[1]=='M'}),tot=Math.round((W-sM)/D1),rev=Math.max(0,Math.min(3,Math.floor(tot/4))),ln=Math.max(1,tot-rev),per=Math.ceil(SL.length/ln),bm=Math.min(rev,3),afterN=Math.max(1,Math.round((O-W2)/D1)-2),rest=ML.slice(bm),out=[];
for(var t=sM,i=0;t<=O;t=addDay(t),i++){var tp=[],n='';
if(t<W){if(i<ln){tp=SL.slice(i*per,(i+1)*per);n='Neu lernen (schriftliche Themen)'}else{var k=i-ln;tp=k<bm?ML.slice(k,k+1):[];n='Wiederholen: Quiz, Fehler wiederholen'+(tp.length?' und ein neues mündliches Thema':'')}}
else if(t<=W2){n='Schriftliche Prüfung. Abends höchstens 15 Minuten Quiz oder Fehler wiederholen, dann Pause.'}
else if(t<O){var j=Math.round((t-W2)/D1)-1;if(j<afterN){tp=rest.slice(Math.floor(j*rest.length/afterN),Math.floor((j+1)*rest.length/afterN));n='Mündliche Themen neu lernen und im Üben-Tab abfragen lassen'}else n='Nur wiederholen: 2 Prüfungsgespräche im Üben-Tab, früh schlafen'}
else n='Mündliche Prüfung. Morgens kurz die Merksätze ansehen, dann ruhig bleiben.';
out.push({t:t,tp:tp,n:n})}return out}
function plan(){if(!S.w){S.w='2026-11-25';S.w2='2026-11-27';S.o='2026-12-02';S.p='2026-12-07';S.s=Date.now();sv()}
var D1=864e5,now=Date.now(),td=pd(now),fs='font:inherit;padding:9px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);width:100%;margin:4px 0 8px;display:block';
function inp(id,l,v){return`<label class='m'>${l}<input type='date' id='${id}' value='${esc(v||'')}' style='${fs}'></label>`}
function cd(l,v){if(!v)return'';var n=Math.round((pd(v)-td)/D1);return n>=0?`<li>${l}: ${n==0?'heute':'in '+n+(n==1?' Tag':' Tagen')}</li>`:''}
function fd(t){return new Date(t).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'})}
function tl(a){return a.map(function(t){return`<li><a href='#${t[0]}'>${S.d[t[0]]?'✓ ':''}${esc(t[2])}</a></li>`}).join('')}
var h=`<h1>Lernplan</h1><div class='card'><h2>Deine Prüfungstermine</h2>${inp('dw','Schriftlich ab',S.w)}${inp('dw2','Schriftlich bis',S.w2)}${inp('do','Mündlich',S.o)}${inp('dp','Praktisch',S.p)}<p class='m'>Ändern erstellt den Plan ab heute neu.</p></div><div class='card'><h2>Countdown</h2><ul>${cd('Schriftlich',S.w)}${cd('Mündlich',S.o)}${cd('Praktisch',S.p)}</ul></div>`;
try{var sc2=S.w&&S.o?sched():[],k=-1;sc2.forEach(function(e,i){if(e.t==td)k=i});if(k<0&&sc2.length&&td<sc2[0].t)k=0;
if(k>=0){var e=sc2[k];h+=`<div class='card'><h2>Heute (${fd(e.t)})</h2><p>${esc(e.n)}</p>${e.tp.length?'<ul>'+tl(e.tp)+'</ul>':''}</div><div class='card'><h2>Die nächsten Tage</h2>`+sc2.slice(k+1,k+4).map(function(e){return`<p><b>${fd(e.t)}</b>: ${esc(e.n)}${e.tp.length?'<br>'+e.tp.map(function(t){return esc(t[2])}).join(', '):''}</p>`}).join('')+`</div>`}
else if(sc2.length)h+=`<div class='card'><p>Für die schriftliche und mündliche Prüfung ist kein Lerntag mehr offen.</p></div>`}catch(x){}
if(S.p)h+=`<div class='card'><h2>Praktische Prüfung</h2><p>Dafür gibt es in der App noch keinen Lernbereich. Plane in den Tagen nach der mündlichen Prüfung Zeit für Übungen an Fällen aus deinem Einsatz ein.</p></div>`;
var due=T.filter(function(t){var id=t[0];if(!S.d[id])return false;var iv=[1,7,21][S.r[id]||0];return iv&&now-(S.d[id]>1e12?S.d[id]:0)>=iv*D1});
h+=`<div class='card'><h2>Zu wiederholen</h2>`+(due.length?due.map(function(t){return`<div class='item' style='margin:8px 0'><a href='#${t[0]}'>${esc(t[2])}</a><button class='btn g' data-w='${t[0]}'>Wiederholt</button></div>`}).join(''):'<p class=m>Nichts fällig. Wiederholt wird nach 1 Tag, 1 Woche und 3 Wochen.</p>')+`</div><div class='card'><h2>So lernst du am besten</h2><ul><li>Neue Themen in kleinen Portionen, danach sofort die Testfragen.</li><li>Mündlich laut üben, in ganzen Sätzen, mit dem Prüfer im Üben-Tab.</li><li>Mit Fällen lernen: Prophylaxe, Pflegeprozess und Schmerz an einem Patienten verbinden.</li><li>Rechtliches genau lernen. Das PflBG gilt seit 1.1.2026 mit neuem § 4 und § 4a, frag die Schule nach der Prüfungsfassung.</li><li>Am Tag vor einer Prüfung nur wiederholen und ausreichend schlafen.</li></ul></div>`;
app.innerHTML=h;
[['dw','w'],['dw2','w2'],['do','o'],['dp','p']].forEach(function(m){var e=$('#'+m[0]);if(e)e.onchange=function(){S[m[1]]=this.value;S.s=Date.now();sv();plan()}});
app.querySelectorAll('[data-w]').forEach(function(b){b.onclick=function(){var id=b.dataset.w;S.r[id]=(S.r[id]||0)+1;S.d[id]=Date.now();sv();plan()}})}

function route(){var h=location.hash.slice(1);["n1","n2","n3","n4","n5"].forEach(function(i){$("#"+i).classList.remove("on")});
if(h=="quiz"){$("#n2").classList.add("on");qmenu()}
else if(h=="quizstart"){$("#n2").classList.add("on");quiz("p",1)}
else if(h=="pruefung"){$("#n2").classList.add("on");quiz("e",1)}
else if(h=="fehler"){$("#n2").classList.add("on");quiz("f",1)}

if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
