<script>
/* Themen: [id, Prüfungsart (S/M/E), Titel, Merksätze, erste Frage, Quellen] */
var T=[
["komm","SM","Kommunikation",["Vier-Seiten-Modell (Schulz von Thun): Sach-, Selbstoffenbarungs-, Beziehungs- und Appellebene – jede Nachricht hat alle vier.","Aktives Zuhören: Zusammenfassen, Nachfragen, Gefühle spiegeln. Ich-Botschaften statt Vorwürfe.","Bei Demenz: validierend kommunizieren (Gefühl ernst nehmen, nicht ständig korrigieren).","Übergabe strukturiert, z. B. mit SBAR (Situation, Background, Assessment, Recommendation)."],["Kollege sagt „Die Infusion ist durchgelaufen“ – du hörst „Du warst zu spät“. Welche Ebene?",["Sachebene","Beziehungsebene","Appellebene"],1,"Das Heraushören eines Vorwurfs ist eine Botschaft auf der Beziehungsebene."],[["Schulz von Thun: Kommunikationsquadrat","https://www.schulz-von-thun.de/die-modelle/das-kommunikationsquadrat"]]],
["proph","S","Prophylaxe",["Typisch: Dekubitus, Sturz, Pneumonie, Thrombose, Kontraktur, Obstipation, Aspiration, Soor/Parotitis.","Gemeinsames Prinzip: Risiko einschätzen → Maßnahmen planen → Betroffene beraten → Wirkung prüfen.","Dekubitus Kategorie 1: nicht wegdrückbare Rötung bei intakter Haut. Wichtigste Maßnahme: Druckentlastung/Bewegungsförderung, Hautinspektion.","Expertenstandards des DNQP gibt es u. a. zu Dekubitus, Sturz, Kontinenz, Ernährung, chronische Wunden."],["Wie sieht ein Dekubitus Kategorie 1 aus?",["Offene Wunde bis zum Knochen","Nicht wegdrückbare Rötung, Haut intakt","Blase mit Flüssigkeit"],1,"Kategorie 1 = nicht wegdrückbares Erythem bei intakter Haut."],[["DNQP: Expertenstandards","https://www.dnqp.de/expertenstandards-und-auditinstrumente/"]]],
["div","S","Divertikulitis",["Entzündung von Darmwand-Ausstülpungen, meist im Sigma. Typisch: Schmerz im linken Unterbauch, Fieber, erhöhte Entzündungswerte, Stuhlveränderung.","Unkompliziert (nur Entzündung) vs. kompliziert (Abszess, Perforation, Peritonitis, Stenose, Fistel).","Alarmzeichen: bretthartes Abdomen, hohes Fieber, Kreislaufinstabilität → sofort Arzt.","Pflege: Schmerz-/Temperaturkontrolle, Stuhlbeobachtung, Flüssigkeit, Ernährung nach Anordnung; im Intervall ballaststoffreich und viel trinken.","Behandlung (Antibiose ja/nein, OP) richtet sich nach Schweregrad – ärztliche Entscheidung nach Leitlinie."],["Typischer Schmerzort bei Sigma-Divertikulitis?",["Rechter Oberbauch","Linker Unterbauch","Epigastrium"],1,"Das Sigma liegt links unten – daher „Linksappendizitis“."],[["AWMF: Leitlinie Divertikelkrankheit/Divertikulitis","https://register.awmf.org/de/leitlinien/detail/021-020"]]],
["stoma","S","Stoma",["Ileostoma (Dünndarm): flüssig-breiiger, hautaggressiver Stuhl. Colostoma (Dickdarm): eher geformter Stuhl. Urostoma: Urinableitung.","Gesund: rosig-rot, feucht. Blass, bläulich oder schwarz = Durchblutungsstörung → Arzt informieren.","Hautschutz, passend zugeschnittene Platte (nicht zu eng/weit), Beutel rechtzeitig wechseln.","Beratung/Anleitung zur Selbstversorgung, Ernährung, Körperbild und Sexualität ansprechen; Stomatherapeut/-in einbinden."],["Welche Stomafarbe ist ein Warnzeichen?",["Rosig-rot","Feucht glänzend","Bläulich-schwarz"],2,"Dunkle Verfärbung weist auf mangelnde Durchblutung (Nekrose) hin."],[["Deutsche ILCO e. V. (Selbsthilfe)","https://www.ilco.de/"]]],
["zvk","S","ZVK & Ernährung",["ZVK: Spitze in der oberen Hohlvene/rechter Vorhof; vor Nutzung Lage kontrollieren (Röntgen/EKG).","Infektionsprävention: Händedesinfektion, aseptisches Arbeiten, Konnektoren desinfizieren, Verband sauber/trocken, Einstichstelle beobachten.","Komplikationen: Katheterinfektion/Sepsis, Thrombose, Luftembolie, Fehllage.","Enteral (Sonde, PEG): Oberkörper 30–45° hoch, Lage prüfen, nach Gabe spülen. Parenteral nur, wenn Darm nicht ausreicht.","Grundsatz: so natürlich wie möglich (oral → enteral → parenteral)."],["Oberkörperposition bei Sondenkost?",["Flach","30–45° erhöht","Kopf tief"],1,"Erhöhung senkt das Aspirationsrisiko."],[["DGEM: Leitlinien","https://www.dgem.de/leitlinien"],["RKI/KRINKO: Gefäßkatheter-Empfehlung (dort suchen)","https://www.rki.de/"]]],
["cu","S","Colitis ulcerosa",["Chronisch-entzündliche Darmerkrankung: beginnt im Rektum, kontinuierlicher Befall, nur Dickdarm, nur Schleimhaut.","Schub: blutig-schleimige Durchfälle, Tenesmen, Bauchschmerz. Morbus Crohn dagegen: gesamter Verdauungstrakt, segmental, alle Wandschichten.","Therapie ärztlich (u. a. 5-ASA, Kortison im Schub, Immunsuppressiva, Biologika).","Komplikationen: toxisches Megakolon, erhöhtes Darmkrebsrisiko → regelmäßige Koloskopie.","Pflege: Flüssigkeits-/Elektrolytbilanz, Hautpflege, Ernährungsberatung, psychosoziale Unterstützung."],["Wo beginnt die Colitis ulcerosa typischerweise?",["Im Rektum","Im Magen","Im Dünndarm"],0,"CU breitet sich vom Rektum kontinuierlich aus."],[["AWMF: S3-Leitlinie Colitis ulcerosa","https://register.awmf.org/de/leitlinien/detail/021-009"]]],
["kult","S","Interkulturelle Pflege",["Ziel: kultursensibel pflegen, ohne Menschen in Schubladen zu stecken – jede Person individuell erfragen.","Leininger: transkulturelle Pflege, Sunrise-Modell.","Wichtige Felder: Sprache, Religion, Ernährung, Schamgefühl, Schmerzausdruck, Rolle der Familie.","Sprachmittlung: professionelle Dolmetschende, nicht Kinder; Selbstreflexion eigener Vorurteile."],["Wer sollte bei Sprachbarriere dolmetschen?",["Minderjähriges Kind","Professionelle Sprachmittlung","Zimmernachbar"],1,"Kinder/Laien überfordern und verfälschen leicht; Datenschutz beachten."],[["Fachliteratur: Leininger, Sunrise-Modell (Lehrbuch/Bibliothek)",""]]],
["copd","S","COPD",["Chronische, nicht vollständig reversible Atemwegsobstruktion. Leitsymptome: Atemnot, Husten, Auswurf. Hauptursache: Rauchen.","Diagnose: Spirometrie (nach Bronchodilatation FEV1/FVC unter 0,7).","Pflege: Lippenbremse, Kutschersitz, Oberkörper hoch, Inhalationstechnik prüfen, Impfberatung, Rauchstopp unterstützen.","Sauerstoff nur nach Anordnung dosiert (Gefahr CO2-Retention).","Exazerbation = akute Verschlechterung → ärztlich abklären."],["Wozu dient die Lippenbremse?",["Atemfrequenz erhöhen","Ausatemwiderstand: Atemwege länger offen halten","Husten unterdrücken"],1,"Der Staudruck beim Ausatmen verhindert den Kollaps der Bronchien."],[["Nationale VersorgungsLeitlinie COPD","https://www.leitlinien.de/themen/copd"]]],
["hilf","S","Hilfsmittel-Finanzierung",["GKV-Hilfsmittel (§ 33 SGB V): ärztliche Verordnung, Hilfsmittelverzeichnis, meist 10 % Zuzahlung (Grenzen beachten).","Pflegehilfsmittel der Pflegekasse (§ 40 SGB XI): Entlastung/Erleichterung der Pflege, auch zum Verbrauch.","Wohnumfeldverbessernde Maßnahmen: Zuschuss der Pflegekasse (Höchstbeträge aktuell nachschlagen).","Neu durch BEEP (Gesetz v. 22.12.2025): Pflegefachpersonen erhalten mehr Befugnisse, u. a. Empfehlung von Pflegehilfsmitteln – Details und Start im Gesetz prüfen."],["Welcher Träger ist für Pflegehilfsmittel zuständig?",["Pflegekasse (SGB XI) bzw. Krankenkasse je nach Zweck","Immer das Sozialamt","Der Hausarzt zahlt"],0,"Abgrenzung: Behandlung/Behinderungsausgleich = GKV, Pflegeerleichterung = Pflegekasse."],[["§ 33 SGB V","https://www.gesetze-im-internet.de/sgb_5/__33.html"],["§ 40 SGB XI","https://www.gesetze-im-internet.de/sgb_11/__40.html"],["DBfK zu BEEP","https://dbfk.de/media/docs/dbfk-aktuell/magazine/2025/12/index.pdf"]]],
["pp","S","Pflegeprozess (Fiechter & Meier)",["6 Schritte: 1 Informationen sammeln, 2 Probleme und Ressourcen erkennen, 3 Pflegeziele festlegen, 4 Maßnahmen planen, 5 durchführen, 6 evaluieren.","Der Prozess ist ein Regelkreis: Evaluation führt zurück in die Planung.","Pflegeproblem oft als PES: Problem – Ursache (Etiology) – Symptome.","Ziele: konkret, realistisch, überprüfbar, mit Zeitpunkt; mit der Person vereinbart.","WHO-Modell hat 4 Schritte, Fiechter/Meier 6."],["Welcher Schritt folgt auf „Pflegeziele festlegen“?",["Evaluation","Maßnahmen planen","Informationen sammeln"],1,"Reihenfolge: Info → Probleme/Ressourcen → Ziele → Planung → Durchführung → Evaluation."],[["Fachliteratur: Fiechter & Meier, „Pflegeplanung“ (1981)",""],["§ 4 PflBG: Pflegeprozessverantwortung","https://lxgesetze.de/pflbg/4"]]],
["infos","S","Informationssammlung",["Quellen: Betroffene, Angehörige, Akten, Beobachtung, Assessments. Objektiv (messbar) und subjektiv (Empfinden) trennen.","Erstgespräch/Pflegeanamnese: Ressourcen und Wünsche gleich mit erfassen.","Strukturmodell (SIS): 6 Themenfelder – Kognition/Kommunikation, Mobilität, krankheitsbezogene Anforderungen, Selbstversorgung, soziale Beziehungen, Wohnen/Häuslichkeit.","Datenschutz und Schweigepflicht beachten; Daten aktuell halten."],["Welche Angabe ist subjektiv?",["Blutdruck 130/80","Patient sagt: „Ich habe Angst“","Gewicht 72 kg"],1,"Subjektiv = Äußerung/Empfinden der Person."],[["DNQP: Expertenstandards","https://www.dnqp.de/expertenstandards-und-auditinstrumente/"]]],
["schm","S","Schmerzmanagement",["Expertenstandard „Schmerzmanagement in der Pflege“ (Aktualisierung 2020) vereint akute und chronische Schmerzen.","Ablauf: Screening → Assessment → bei komplexer Situation pflegerische Schmerzexpertise hinzuziehen.","Chronisch: länger als 3 Monate.","Selbstauskunft (NRS/VAS) wenn möglich; bei Verständigungsproblemen Beobachtungsinstrumente.","Medikamente nur nach Anordnung, plus nicht-medikamentöse Maßnahmen; Wirkung und Nebenwirkung kontrollieren, Beratung/Schulung."],["Ab wann gilt ein Schmerz als chronisch?",["Ab 1 Woche","Ab 3 Monaten","Ab 1 Jahr"],1,"Gängige Definition: länger als drei Monate."],[["Forum Verlag: Zusammenfassung","https://www.forum-verlag.com/fachwissen/gesundheitswesen-und-pflege/expertenstandard-schmerz/"],["DNQP","https://www.dnqp.de/expertenstandards-und-auditinstrumente/"]]],
["lung","S","Lungenkarzinom & Palliative Care",["Kleinzellig (SCLC, aggressiv) vs. nicht-kleinzellig (NSCLC, häufiger). Hauptrisiko: Rauchen.","Symptome: Husten (>3 Wochen), Blut im Auswurf, Atemnot, Gewichtsverlust, Schmerz.","Palliative Care: Lebensqualität von Betroffenen und Angehörigen bei lebensbedrohlicher Erkrankung; Symptomkontrolle (Atemnot, Schmerz, Angst), ganzheitlich, interprofessionell.","Strukturen: SAPV, Hospiz, Palliativstation; Patientenverfügung/Vorsorgevollmacht ansprechen."],["Worauf zielt Palliative Care vorrangig?",["Heilung um jeden Preis","Lebensqualität und Symptomlinderung","Nur Sterbebegleitung in den letzten Stunden"],1,"Palliative Care beginnt früh, nicht erst am Lebensende."],[["Leitlinienprogramm Onkologie: Lungenkarzinom","https://www.leitlinienprogramm-onkologie.de/leitlinien/lungenkarzinom/"],["Leitlinienprogramm Onkologie: Palliativmedizin","https://www.leitlinienprogramm-onkologie.de/leitlinien/palliativmedizin/"]]],
["exp","SM","Expertenstandards",["Entwickelt vom DNQP (Hochschule Osnabrück); Aufbau: Struktur-, Prozess-, Ergebniskriterium.","Stand 12.11.2026: Chronische Wunden – 2. Aktualisierung 2025. Schmerzmanagement – 2020. Demenz („Beziehungsgestaltung“) – 1. Aktualisierung, Entwurf bis 8.5.2026 kommentiert, finale Fassung für Herbst 2026 geplant. Dekubitus (3.) und Ernährung (2.) Aktualisierungen laufen.","Nicht automatisch gesetzlich verpflichtend, in der Langzeitpflege aber über § 113a SGB XI relevant.","Immer prüfen, ob eine neuere Fassung erschienen ist."],["Woraus besteht jeder Expertenstandard?",["Nur Handlungsanweisungen","Struktur-, Prozess- und Ergebniskriterium","Nur Checklisten"],1,"Jede Ebene ist mit Begründung und Kommentierung hinterlegt."],[["DNQP Pressemitteilung März 2026 (Demenz)","https://www.dnqp.de/fileadmin/HSOS/Homepages/DNQP/Dateien/Pressemitteilungen/PM_DNQP26.03.18.pdf"],["DNQP Pressemitteilung Febr. 2026 (Dekubitus)","https://www.dnqp.de/fileadmin/HSOS/Homepages/DNQP/Dateien/Pressemitteilungen/PM_DNQP26.02.11.pdf"],["AOK zur Verbindlichkeit","https://www.aok.de/gp/news-allgemein/newsdetail/expertenstandard-demenz-2026-aktualisiert"]]],
["schw","SM","Schweigepflicht",["§ 203 StGB: unbefugte Offenbarung fremder Geheimnisse ist strafbar; gilt auch für Pflegefachpersonen.","Befugt offenbaren: mit Einwilligung/Entbindung durch die Person, bei gesetzlicher Pflicht (z. B. Meldepflichten), im rechtfertigenden Notstand (§ 34 StGB).","Gilt auch gegenüber Angehörigen und nach dem Tod; im Team nur Informationen, die für die Versorgung nötig sind.","Zusätzlich Datenschutz (DSGVO), keine Infos am Telefon ohne Identitätsprüfung."],["Wer kann von der Schweigepflicht entbinden?",["Die Stationsleitung","Die betroffene Person selbst","Jeder Angehörige"],1,"Einwilligung/Entbindung kommt von der geschützten Person."],[["§ 203 StGB","https://www.gesetze-im-internet.de/stgb/__203.html"]]],
["ber","S","Beratungen",["Information (Wissen geben) – Anleitung (Handlung zeigen/üben) – Schulung (geplante Gruppe/Serie) – Beratung (gemeinsam Lösung finden).","Beratung: Anliegen klären, Informationen anbieten, Optionen abwägen; Entscheidung bleibt bei der Person.","Pflegeberatung: Anspruch nach § 7a SGB XI; Beratungseinsatz bei Pflegegeld: § 37 Abs. 3 SGB XI.","Verständlich sprechen, Verstehen prüfen (Teach-back), dokumentieren."],["Wer entscheidet am Ende einer Beratung?",["Die beratende Person","Die beratene Person","Der Arzt"],1,"Autonomie: Beratung unterstützt, ersetzt aber nicht die Entscheidung."],[["§ 7a SGB XI","https://www.gesetze-im-internet.de/sgb_11/__7a.html"]]],
["leuk","S","Leukämie",["Bösartige Erkrankung der Blutbildung. Akut (AML, ALL) vs. chronisch (CML, CLL).","Verdrängung der normalen Blutbildung → Anämie (Blässe, Müdigkeit), Infektanfälligkeit (Neutropenie), Blutungen (Thrombozytopenie).","Pflege: Infektionsschutz (Händehygiene, ggf. Schutzmaßnahmen), Mundpflege (Mukositis), Blutungsprophylaxe (weiche Zahnbürste, keine i.m.-Injektionen bei Thrombopenie).","Chemotherapie-Nebenwirkungen beobachten: Übelkeit, Haarausfall, Fieber (Notfall bei Neutropenie)."],["Welche Zellreihe fehlt bei Blutungsneigung?",["Erythrozyten","Thrombozyten","Lymphozyten"],1,"Thrombozyten sorgen für die primäre Blutstillung."],[["Onkopedia (DGHO): Leukämie-Leitlinien","https://www.onkopedia.com/de/onkopedia/guidelines"]]],
["epi","S","Epilepsie",["Anfälle: fokal oder generalisiert. Status epilepticus: Anfall, der nicht von selbst endet (Faustregel > 5 Minuten) → Notruf.","Erste Hilfe: Ruhe bewahren, Verletzungen verhindern, nicht festhalten, nichts in den Mund, Zeit messen, danach stabile Seitenlage, Beobachtung dokumentieren.","Medikamente (Antikonvulsiva) regelmäßig; Notfallmedikation nur nach ärztlicher Anordnung.","Beratung: Schlafmangel, Alkohol, Lichtreize als Auslöser; Alltag, Führerschein, Selbsthilfe."],["Ab wann Notruf bei einem Krampfanfall?",["Sofort bei Anfall > 5 Minuten","Erst nach 30 Minuten","Nie"],0,"Länger anhaltende Anfälle sind lebensbedrohlich."],[["AWMF: Leitlinie Erster Anfall/Epilepsien","https://register.awmf.org/de/leitlinien/detail/030-041"]]],
["qm","M","Qualitätsmanagement",["Donabedian: Struktur-, Prozess-, Ergebnisqualität.","PDCA-Zyklus: Plan – Do – Check – Act (kontinuierliche Verbesserung).","Instrumente: Standards, Audits, Fehlermeldesysteme (CIRS), Beschwerdemanagement, Zertifizierung.","Qualitätsentwicklung ist (nach § 4 PflBG, Abs. 2 Nr. 3) vorbehaltene Pflegeaufgabe."],["Wofür steht das „C“ in PDCA?",["Control/Check = Überprüfen","Care","Change"],0,"Nach der Durchführung wird die Wirkung überprüft."],[["§ 113a SGB XI","https://www.gesetze-im-internet.de/sgb_11/__113a.html"],["CIRS-Medical","https://www.cirsmedical.de/"]]],
["amg","M","Arzneimittelgesetz",["AMG regelt Zulassung, Herstellung, Abgabe und Überwachung von Arzneimitteln; Verschreibungs- und Apothekenpflicht.","Pflege: 6-R-Regel – richtige Person, Arznei, Dosis, Applikation, Zeit, Dokumentation.","Gabe nach schriftlicher ärztlicher Anordnung; Lagerung, Verfalldatum, Verfärbungen prüfen.","Nebenwirkungen beobachten und melden (Pharmakovigilanz)."],["Wer ordnet Medikamente an?",["Pflegefachperson","Ärztin/Arzt (bzw. Befugte)","Apotheke"],1,"Anordnung ärztlich, Durchführung durch Pflege (Delegation)."],[["AMG","https://www.gesetze-im-internet.de/amg_1976/"]]],
["btm","M","BtM-Gesetz",["BtMG/BtMVV regeln Verkehr und Verschreibung von Betäubungsmitteln (z. B. Opioide).","Verschreibung nur auf BtM-Rezept durch Berechtigte.","Aufbewahrung verschlossen, gegen unbefugte Entnahme gesichert; lückenloser Nachweis (Zu-/Abgang, Bestand).","Entsorgung und Rückgabe dokumentiert; Verantwortlichkeiten klar regeln."],["Wie werden BtM aufbewahrt?",["Offen im Schrank","Verschlossen und gegen Entnahme gesichert","Im Dienstzimmer"],1,"Sicherung und lückenlose Dokumentation sind Pflicht."],[["BtMG","https://www.gesetze-im-internet.de/btmg_1981/"]]],
["del","M","Delegation",["Ärztliche Aufgaben können an Pflege delegiert werden: Anordnungsverantwortung (Arzt), Durchführungsverantwortung (Pflege).","Voraussetzung: Qualifikation, Anordnung, Einweisung; bei Zweifel Remonstration (Bedenken äußern, ggf. ablehnen).","Vorbehaltene Pflegeaufgaben (§ 4 PflBG) dürfen nicht an Personen ohne Erlaubnis übertragen werden.","Neu seit 1.1.2026: § 4a PflBG – eigenverantwortliche Heilkundeausübung."],["Wer trägt die Anordnungsverantwortung?",["Pflegefachperson","Die anordnende ärztliche Person","Die Heimleitung"],1,"Durchführungsverantwortung liegt bei der ausführenden Person."],[["§ 4 PflBG","https://lxgesetze.de/pflbg/4"],["DBfK zu BEEP","https://dbfk.de/media/docs/dbfk-aktuell/magazine/2025/12/index.pdf"]]],
["rolle","M","Rollen & Intrarollenkonflikt",["Intrarollenkonflikt: unvereinbare Erwartungen verschiedener Bezugsgruppen (Patient, Team, Leitung, Arzt) an dieselbe Rolle.","Interrollenkonflikt: zwischen Rollen (Pflegekraft vs. Elternrolle).","Rollen Pflegender: Pflegeexpertin, Beraterin, Anwältin (Advocacy), Teammitglied, Lehrende, Managerin.","Umgang: Rolle klären, Prioritäten setzen, im Team besprechen, Supervision."],["Patient wünscht lange Zuwendung, die Leitung verlangt Zeitersparnis, die Ärztin viel Dokumentation: alle erwarten etwas von derselben Rolle. Konfliktart?",["Intrarollenkonflikt","Interrollenkonflikt","Kein Konflikt"],0,"Unvereinbare Erwartungen verschiedener Bezugsgruppen an dieselbe Rolle = Intrarollenkonflikt."],[["Fachliteratur: Rollentheorie in der Pflege",""]]],
["sett","M","Settings",["Akutpflege (Krankenhaus): kurze Verweildauer, hohe Taktung, Diagnostik/Therapie.","Kurzzeitpflege: befristet (z. B. nach Klinik), Übergang; § 42 SGB XI.","Langzeitpflege: Wohnen und Pflege, Beziehung, Alltag, Lebensqualität.","Ambulant: Gast im Haushalt, Touren, Angehörige, Zusammenspiel von SGB V (HKP) und SGB XI."],["Wo ist die Pflegekraft „Gast im Haushalt“?",["Krankenhaus","Ambulante Pflege","Pflegeheim"],1,"Pflege findet in der privaten Wohnung statt."],[["§ 42 SGB XI","https://www.gesetze-im-internet.de/sgb_11/__42.html"]]],
["team","M","Zusammenarbeit",["Interdisziplinär: zwischen Berufsgruppen (Pflege, Medizin, Physio, Sozialdienst). Intradisziplinär: innerhalb der Pflege (Fachkraft, Assistenz, Praxisanleitung).","Instrumente: Übergabe (SBAR), Visite, Fallbesprechung, Entlassmanagement.","Gelingensfaktoren: klare Rollen, Respekt, gemeinsame Ziele; Konflikte früh ansprechen."],["„Zusammenarbeit von Pflege und Physiotherapie“ ist …?",["Intradisziplinär","Interdisziplinär","Delegation"],1,"Verschiedene Berufsgruppen = interdisziplinär."],[["§ 39 SGB V (Entlassmanagement)","https://www.gesetze-im-internet.de/sgb_5/__39.html"]]],
["bel","M","Berufliche Belastungen",["Körperlich: Heben/Tragen, Schichtdienst. Psychisch: Tod, Zeitdruck, Konflikte, Gewalt.","Folgen: Erschöpfung, Burnout, Krankenstand, Berufsausstieg.","Ressourcen: Teamunterstützung, Supervision, kollegiale Beratung, verlässliche Dienstpläne, rückenschonende Arbeitsweisen.","Arbeitgeber müssen Gefährdungen beurteilen (ArbSchG, inkl. psychischer Belastung)."],["Was zählt zu den Ressourcen?",["Supervision","Dauerhafte Überstunden","Fehlende Pausen"],0,"Supervision/kollegiale Beratung stärken die Bewältigung."],[["§ 5 ArbSchG","https://www.gesetze-im-internet.de/arbschg/__5.html"]]],
["ausl","M","Fachkräfte aus dem Ausland",["Anerkennung ausländischer Abschlüsse: Gleichwertigkeitsprüfung; bei Defiziten Anpassungsmaßnahme/Kenntnisprüfung (Regeln aktuell prüfen).","Sprache: i. d. R. B2 plus Fachsprache.","Ethik: WHO-Verhaltenskodex – keine aktive Abwerbung aus Ländern mit Personalnot.","Integration: Einarbeitung, Mentoring, kultursensibles Team, Wohnen/Behördenhilfe."],["Worauf verpflichtet der WHO-Kodex?",["Auf ethische Anwerbung ohne Schaden für Herkunftsländer","Auf Gehaltsobergrenzen","Auf Sprachtests C2"],0,"Ziel: fairer Umgang mit Ländern mit Fachkräftemangel."],[["Anerkennung in Deutschland","https://www.anerkennung-in-deutschland.de/"],["Make it in Germany","https://www.make-it-in-germany.com/de/"]]],
["pflbg","M","Pflegeberufegesetz",["Generalistische Ausbildung seit 2020: Pflegefachfrau/Pflegefachmann; alternativ hochschulische Ausbildung.","§ 4 PflBG (seit 1.1.2026: „Vorbehaltene Aufgaben, Pflegeprozessverantwortung“): 1 Bedarf erheben/feststellen und Pflege planen, 2 Prozess organisieren/steuern, 3 Qualität analysieren/sichern/entwickeln.","Neu: § 4a PflBG – eigenverantwortliche Heilkundeausübung (BEEP, Gesetz v. 22.12.2025).","Praxisanleitung, Pflegeschulen, Ausbildungsfinanzierung."],["Wie viele vorbehaltene Aufgaben nennt § 4 Abs. 2 PflBG?",["2","3","5"],1,"Bedarfserhebung/Planung, Prozesssteuerung, Qualität."],[["§ 4 PflBG (Text, Stand 22.12.2025)","https://lxgesetze.de/pflbg/4"],["Gesetze im Internet: PflBG","https://www.gesetze-im-internet.de/pflbg/"]]]
];

["hyg","E","Hygiene und Infektionsprävention",["Händedesinfektion ist die wichtigste Einzelmaßnahme. WHO-Fünf-Momente: vor Patientenkontakt, vor aseptischen Tätigkeiten, nach Kontakt mit potenziell infektiösem Material, nach Patientenkontakt, nach Kontakt mit der Patientenumgebung.","Einwirkzeit des Händedesinfektionsmittels nach Herstellerangabe einhalten (häufig 30 Sekunden), Hände vollständig benetzen.","Handschuhe ersetzen die Händedesinfektion nicht: vor dem Anziehen und nach dem Ausziehen desinfizieren.","Standardhygiene gilt bei allen Patienten. Zusätzliche Maßnahmen (z. B. Kontaktisolierung bei MRSA oder Noro) richten sich nach dem Hygieneplan.","Typische nosokomiale Infektionen: Harnwegsinfekt (Katheter), Pneumonie, Katheter-Sepsis, Wundinfektion. Vorbeugen: Indikation prüfen, aseptisch arbeiten, Zugänge und Katheter früh entfernen."],["Ersetzen Handschuhe die Händedesinfektion?",["Ja, sie sind sicher genug","Nein, vorher und nachher desinfizieren","Nur bei Kontakt mit Blut nicht"],1,"Handschuhe können Löcher haben und werden beim Ausziehen kontaminiert."],[["Aktion Saubere Hände","https://www.aktion-sauberehaende.de/"],["RKI: Krankenhaushygiene (KRINKO-Empfehlungen, dort suchen)","https://www.rki.de/"]]],
["dm","E","Diabetes mellitus",["Typ 1: absoluter Insulinmangel (Autoimmunerkrankung), Insulin lebenslang. Typ 2: Insulinresistenz und Mangel, Therapie von Ernährung und Bewegung bis Tabletten und Insulin.","Hypoglykämie (Unterzucker): Schwitzen, Zittern, Heißhunger, Unruhe, Verwirrtheit, im Extremfall Bewusstlosigkeit. Bei Bewusstsein schnell wirksame Kohlenhydrate (Traubenzucker, Saft), danach langsam wirksame, Blutzucker nachmessen.","Bewusstlos: stabile Seitenlage, nichts einflößen, Notruf, Glukagon oder Glukose nach ärztlicher Anordnung.","Hyperglykämie: Durst, viel Urin, Müdigkeit. Bei Typ 1 Ketoazidose (Acetongeruch, tiefe Atmung, Übelkeit) = Notfall.","Pflege: Blutzuckermessung nach Plan, Insulin nach Anordnung (Spritzstellen wechseln), Fußkontrolle, Schulung und Ernährungsberatung."],["Was gibst du einem wachen Menschen mit Unterzucker zuerst?",["Insulin","Schnell wirksame Kohlenhydrate","Nur Wasser"],1,"Traubenzucker oder zuckerhaltiger Saft heben den Zucker schnell an."],[["Nationale VersorgungsLeitlinie Diabetes","https://www.leitlinien.de/themen/diabetes"],["Deutsche Diabetes Gesellschaft","https://www.deutsche-diabetes-gesellschaft.de/"]]],
["dem","E","Demenz und Delir",["Häufigste Form: Alzheimer-Krankheit. Weitere: vaskuläre Demenz, Lewy-Körper-Demenz, frontotemporale Demenz.","Symptome: Gedächtnis, Orientierung, Sprache, Alltagsfähigkeit, dazu Verhaltensänderungen. Herausforderndes Verhalten ist oft Ausdruck unerfüllter Bedürfnisse (Schmerz, Angst, Toilette, Langeweile).","Kommunikation: ruhig, kurze Sätze, Blickkontakt, Gefühl ernst nehmen (Validation), nicht ständig korrigieren.","Delir ist etwas anderes: akut beginnend, schwankend, meist behandelbar. Ursache suchen (Infekt, Flüssigkeitsmangel, Medikamente, Schmerz).","Freiheitsentziehende Maßnahmen vermeiden, Schmerz mit Beobachtungsskala (BESD) erfassen. Expertenstandard Demenz (Beziehungsgestaltung) ist in Überarbeitung."],["Wodurch unterscheidet sich ein Delir typischerweise von einer Demenz?",["Beginnt akut und schwankt","Dauert immer Jahre","Betrifft nur das Gedächtnis"],0,"Delir: akut, wechselnder Verlauf, oft behandelbare Ursache."],[["Deutsche Alzheimer Gesellschaft","https://www.deutsche-alzheimer.de/"],["AWMF: S3-Leitlinie Demenzen","https://register.awmf.org/de/leitlinien/detail/038-013"],["DNQP Pressemitteilung März 2026 (Demenz)","https://www.dnqp.de/fileadmin/HSOS/Homepages/DNQP/Dateien/Pressemitteilungen/PM_DNQP26.03.18.pdf"]]],
["rea","E","Notfall und Reanimation (BLS)",["Bewusstsein prüfen (ansprechen, anfassen), Atmung prüfen (höchstens 10 Sekunden). Keine oder keine normale Atmung = Herz-Kreislauf-Stillstand.","Sofort Notruf 112 (bzw. Notfallnummer der Einrichtung), Herzdruckmassage beginnen, AED holen lassen.","Herzdruckmassage: Mitte des Brustkorbs, 100–120 pro Minute, Tiefe etwa 5–6 cm, Brustkorb vollständig entlasten, Unterbrechungen minimieren. Verhältnis 30 Kompressionen : 2 Beatmungen.","AED so früh wie möglich einsetzen und den Sprachanweisungen folgen.","Reanimationsstatus und Patientenverfügung beachten, Ereignis dokumentieren. Die europäischen Leitlinien (ERC) werden regelmäßig aktualisiert, prüf den aktuellen Stand."],["Wie ist das Verhältnis von Herzdruckmassage zu Beatmung beim Erwachsenen?",["15 : 2","30 : 2","5 : 1"],1,"30 Kompressionen, dann 2 Beatmungen."],[["Deutscher Rat für Wiederbelebung (GRC)","https://www.grc-org.de/"],["European Resuscitation Council","https://www.erc.edu/"]]]
];

var D={
"proph":[["Dekubitus: Kategorien & Stellen","Kat. 1: nicht wegdrückbare Rötung, Haut intakt. Kat. 2: Teilverlust der Haut (Blase oder flaches Ulkus ohne Beläge). Kat. 3: Verlust aller Hautschichten, Fettgewebe sichtbar, Knochen/Sehne/Muskel nicht freiliegend. Kat. 4: Knochen, Sehne oder Muskel liegen frei. Typische Stellen: Kreuzbein, Fersen, Trochanter, Sitzbein, Hinterkopf, Ellenbogen, Knöchel. Maßnahmen: tägliche Hautinspektion, Bewegungsförderung, Druckentlastung (30°-Schräglage statt 90°-Seitenlage, Fersen frei lagern), geeignete Auflagen/Matratzen, Haut schützen, gerötete Stellen nicht massieren. Lagerungsintervalle individuell nach Hautreaktion und Risiko, kein starres Schema."],["Pneumonie- und Thromboseprophylaxe","Pneumonie: Risiko bei Immobilität, flacher Atmung, Schluckstörung, Abwehrschwäche. Maßnahmen: Mobilisation, Oberkörper hoch, Atemübungen/Atemtrainer, ausreichend trinken, Mundpflege, Schluckkontrolle, Impfberatung (STIKO). Thrombose: Virchow-Trias = Gefäßwandschaden, verlangsamter Blutfluss, erhöhte Gerinnungsneigung. Zeichen: einseitige Schwellung, Spannungsgefühl, Überwärmung, Verfärbung. Maßnahmen: Frühmobilisation, Bewegungsübungen, Kompression und Heparin nur nach Anordnung. Bei Verdacht Bein ruhig stellen, nicht massieren, Arzt. Plötzliche Atemnot, Thoraxschmerz und Tachykardie können eine Lungenembolie sein = Notfall."],["Sturzprophylaxe & Fixierung","Intrinsisch: Alter, Gleichgewichts-/Sehstörung, Demenz, Medikamente, Inkontinenz. Extrinsisch: Stolperfallen, Beleuchtung, Schuhe, Hilfsmittel. Maßnahmen: Risiko einschätzen, Bewegung und Kraft/Balance fördern, Umgebung sichern, Sehhilfe, feste Schuhe, Medikamente ärztlich überprüfen lassen, beraten. Fixierung ist eine freiheitsentziehende Maßnahme: nur mit Einwilligung bzw. richterlicher Genehmigung (Betreuungsrecht, § 1831 BGB), im akuten Notfall (§ 34 StGB) kurzfristig, immer Alternativen zuerst."]],
"pp":[["Die 6 Schritte mit Beispiel","1 Informationen: Frau M., 82, Hüft-OP, ängstlich beim Aufstehen. 2 Problem + Ursache + Symptome: Sturzgefahr durch Gangunsicherheit nach OP, Schwindel beim Aufstehen. Ressource: möchte selbstständig bleiben, motiviert. 3 Ziel (konkret, messbar, mit Zeitpunkt): Frau M. geht bis Freitag mit Rollator 20 m ohne Hilfe. 4 Maßnahmen (Wer, Was, Wie oft, Womit): täglich 2× Gehübung mit Rollator, Pflegefachperson begleitet, Blutdruck vor dem Aufstehen. 5 Durchführung und Dokumentation. 6 Evaluation: Ziel erreicht → beenden; teilweise → anpassen; nicht erreicht → Ursachen suchen und neu planen."],["Pflegemodelle","Krohwinkel: 13 ABEDL (Aktivitäten, Beziehungen und existenzielle Erfahrungen des Lebens). Roper/Logan/Tierney: 12 Lebensaktivitäten. Orem: Selbstpflegedefizit-Theorie (Pflege greift ein, wenn Selbstpflege nicht reicht). Modelle sind Denkrahmen, der Pflegeprozess ist der Ablauf."],["Dokumentation","Zeitnah, nachvollziehbar, mit Handzeichen, nicht radieren, Fachsprache verständlich. Dient Qualitätssicherung, Kommunikation im Team und Haftungsnachweis. Das Strukturmodell (SIS) verschlankt die Dokumentation und setzt auf Abweichungen von der Planung. Planung und Steuerung des Prozesses sind nach § 4 PflBG vorbehaltene Aufgaben."]],
"schm":[["Schmerzarten & Erfassung","Nozizeptiv (Gewebe, z. B. OP, Knochen) vs. neuropathisch (Nerven, brennend, einschießend). Akut vs. chronisch (länger als 3 Monate). Erfassen: Ort, Qualität, Intensität in Ruhe und Belastung, Verlauf, Auslöser, Begleitsymptome, Auswirkungen auf Schlaf/Alltag. Skalen: NRS 0–10, VAS, VRS. Bei Demenz oder Verständigungsproblemen Fremdeinschätzung, z. B. BESD (Mimik, Lautäußerung, Körpersprache, Trost). Auch Verhaltensänderung (Unruhe, Rückzug) kann Schmerz bedeuten."],["WHO-Stufenschema & Pflege-Rolle","Stufe 1 Nicht-Opioide (Paracetamol, Metamizol, NSAR). Stufe 2 schwache Opioide. Stufe 3 starke Opioide. Co-Analgetika bei neuropathischem Schmerz. Prinzipien: nach Uhrzeit, möglichst oral, individuell, Nebenwirkungen vorbeugen (bei Opioiden Obstipationsprophylaxe ärztlich abstimmen, Übelkeit, Sedierung, Atmung beobachten). Pflege: Anordnung umsetzen, Wirkung und Nebenwirkung kontrollieren, dokumentieren, Arzt informieren wenn Ziel nicht erreicht. Nicht-medikamentös: Lagerung, Wärme/Kälte (Kontraindikationen prüfen), Entspannung, Ablenkung, Bewegung."]],
"copd":[["Schweregrad & Therapie","GOLD 1–4 nach FEV1 (nach Bronchodilatation): 1 mild ≥ 80 %, 2 moderat 50–79 %, 3 schwer 30–49 %, 4 sehr schwer < 30 % des Solls. Medikamente (ärztlich): kurz-/langwirksame Bronchodilatatoren (SABA, LABA, LAMA), inhalative Kortikoide in ausgewählten Fällen. Pflege prüft Inhalationstechnik (Pulverinhalator vs. Dosieraerosol mit Spacer), Mundspülen nach inhalativem Kortison (Soor). Langzeit-Sauerstofftherapie bei dauerhaft niedrigem Sauerstoff im Blut, ärztlich verordnet, mehrere Stunden täglich."],["Pflege im Alltag & Notfall","Atemerleichternde Stellungen: Kutschersitz, Torwartstellung, Oberkörper hoch. Lippenbremse, Atemtherapie, Sekretlösung (trinken, inhalieren, Klopfen/Drainage nach Anleitung). Ernährung: kleine kalorienreiche Mahlzeiten, Gewicht beobachten. Impfungen und Infektvermeidung. Rauchstopp unterstützen. Exazerbation: mehr Atemnot, mehr oder eitriger Auswurf → Arzt. Bei Müdigkeit, Kopfschmerz, Verwirrtheit unter Sauerstoff an CO2-Retention denken und Arzt informieren, Sauerstoff nicht eigenmächtig erhöhen. Komplikation: Cor pulmonale (Beinödeme, Rechtsherzbelastung)."]],
"stoma":[["Arten, Komplikationen, Alltag","Indikationen: Tumor, CED, Perforation/Divertikulitis, Trauma. Temporär (z. B. doppelläufig, schützt Naht) oder endständig. Versorgung ein- oder zweiteilig, Schablone zum Zuschneiden, Hautschutz (Ring, Paste). Komplikationen: Hautschäden/Mazeration (zu großer Ausschnitt, Stuhlkontakt), Pilzbefall, Retraktion, Prolaps, Stenose, parastomale Hernie, Nekrose. Beratung: Ileostoma Dehydratationsrisiko, viel trinken; Elektrolyte beachten; Retardmedikamente ärztlich klären. Kolostoma: blähende Speisen individuell testen. Schweres Heben meiden (Hernie). Körperbild, Sexualität und Selbsthilfe (ILCO) ansprechen. Versorgung ist ein Hilfsmittel (ärztliche Verordnung)."]],
"del":[["Verantwortung & Haftung","Arzt: Anordnungs-, Auswahl- und Überwachungsverantwortung. Pflegefachperson: Übernahme- und Durchführungsverantwortung. Prüfe vor Übernahme: Qualifikation, Einweisung, klare schriftliche Anordnung. Bei Zweifel Remonstrationspflicht: Bedenken äußern, ggf. ablehnen (sonst Übernahmeverschulden). Nicht delegierbar sind Diagnose, Indikationsstellung und Therapieentscheidung. Fehler können strafrechtlich (fahrlässige Körperverletzung) und zivilrechtlich (Schadensersatz) relevant werden."],["Delegation vs. Substitution","Delegation: Arzt bleibt verantwortlich, Pflege führt aus. Substitution: Pflegefachpersonen üben bestimmte Heilkunde eigenverantwortlich aus (§ 4a PflBG, neu durch BEEP). Davon getrennt: Delegation pflegerischer Tätigkeiten an Pflegeassistenz durch die Fachperson. Die Fachperson bleibt für Auswahl, Anleitung und Kontrolle verantwortlich, vorbehaltene Aufgaben (§ 4 PflBG) dürfen nicht übertragen werden."]],
"epi":[["Anfallsformen & Ablauf","ILAE: fokal (mit/ohne Bewusstseinsstörung), generalisiert (tonisch-klonisch, Absence, myoklonisch), unklar. Tonisch-klonischer Anfall: Sturz/Verkrampfung, Zuckungen, danach postiktale Phase (Müdigkeit, Verwirrtheit, Terminalschlaf), mögliche Zungenbiss/Einnässen. Absencen: kurze Abwesenheit, v. a. Kinder. Beobachten und dokumentieren: Beginn, Dauer, Ablauf (seitenbetont?), Bewusstsein, Atmung, Hautfarbe, Verletzungen, Zustand danach."],["Notfall, Therapie, Alltag","Notruf bei Anfall > 5 Minuten, Serie ohne Erholung, erstem Anfall, Verletzung, Atemproblemen. Notfallmedikament (Benzodiazepin) nur nach Anordnung. Dauertherapie regelmäßig, nicht eigenmächtig absetzen. Auslöser: Schlafmangel, Alkohol, Flackerlicht, vergessene Tabletten. Sicherheit: duschen statt baden, Absturzsicherung. Beratung: Fahreignung nach Anfallsfreiheit ärztlich klären, einige Antiepileptika schwächen hormonelle Verhütung, Schwangerschaft vorher ärztlich planen."]],
"komm":[["Techniken & schwierige Situationen","Watzlawick: Man kann nicht nicht kommunizieren; jede Nachricht hat Inhalts- und Beziehungsaspekt. Verbal, nonverbal, paraverbal (Tonfall). Techniken: aktives Zuhören, Paraphrasieren, offene Fragen, Pausen, Augenhöhe, Blickkontakt. Aggression: ruhig bleiben, Abstand wahren, Gefühl benennen, Hilfe holen, Eigenschutz zuerst. Aphasie/Hörstörung/Demenz: kurze Sätze, Ja-Nein-Fragen, Zeit lassen, Bildkarten; validierend begleiten statt korrigieren. Schlechte Nachrichten überbringt die ärztliche Person; Pflege bleibt, hört zu und begleitet. Konflikt im Team: Ich-Botschaft, Sachlichkeit, konkretes Verhalten ansprechen."]],
"div":[["Entstehung, Diagnostik, Therapie","Divertikulose (Ausstülpungen, Bindegewebsschwäche, Druck im Darm, ballaststoffarme Kost, Alter) wird zur Divertikulitis, wenn sich Divertikel entzünden. Diagnostik: CRP/Leukozyten, Sonografie, CT. Koloskopie nicht im akuten Schub (Perforationsgefahr), später zum Ausschluss eines Tumors. Kompliziert: Abszess, Perforation, Peritonitis → stationär, Nahrungskarenz, Infusion, Antibiose, Drainage oder OP (Sigmaresektion, ggf. Hartmann-Operation mit endständigem Stoma). Pflege: Peritonitiszeichen (Abwehrspannung, starker Schmerz, Fieber, Kreislauf), Schmerz, Bilanz, Stuhl, OP-Vorbereitung, Stomaberatung. Vorbeugen: ballaststoffreich, viel trinken, Bewegung, Gewicht, Rauchstopp."]],
"zvk":[["ZVK, Port, Komplikationen","Zugänge: V. subclavia, V. jugularis interna, V. femoralis; PICC und Port als Varianten (Port: unter der Haut, Anstechen mit Spezialnadel, steril). Indikationen: Chemotherapie, parenterale Ernährung, Katecholamine, ZVD, fehlender peripherer Zugang. Nach Anlage Lagekontrolle und Ausschluss Pneumothorax. Sterile Verbandwechsel und Systemwechsel nach Hygieneplan. Zeichen einer Infektion: Rötung, Schwellung, Schmerz, Fieber/Schüttelfrost → Arzt. Armschwellung = Thromboseverdacht. Luftembolie bei offener Diskonnektion: Zugang verschließen, Notruf, Lagerung nach Hausstandard."],["Enterale & parenterale Ernährung","Sonden: nasogastral (kurzfristig), PEG (längerfristig), Jejunalsonde. Lagekontrolle nach Standard (z. B. Markierung, Magensaft-pH). Gabe per Pumpe oder Bolus, Oberkörper hoch. Spülen vor/nach Gabe und Medikamenten (Verstopfung vermeiden). Medikamente einzeln geben, Retard- und magensaftresistente Präparate nicht zerkleinern. Mundpflege auch ohne Essen. Komplikationen: Aspiration, Durchfall, Übelkeit, Hautreizung an der PEG. Parenteral: wenn der Darm nicht ausreicht, Infektionsrisiko, Blutzucker und Elektrolyte nach Anordnung kontrollieren."]],
"cu":[["Diagnostik, Schub, Komplikationen","Diagnose: Koloskopie mit Histologie, Calprotectin im Stuhl, Labor (CRP, Hb). Schub dokumentieren: Stuhlfrequenz, Blutbeimengung, Gewicht, Fieber, Schmerz. Pflege: Flüssigkeit und Elektrolyte, Perianalpflege, Ernährung individuell (keine Einheitsdiät), Mangelernährung verhindern. Medikamente: Kortison (Nebenwirkungen), Immunsuppressiva/Biologika (Infektionsrisiko). Extraintestinal: Gelenke, Haut, Augen. Notfall: toxisches Megakolon (Fieber, geblähter Bauch, Kreislaufprobleme), starke Blutung. Langfristig Krebsvorsorge. OP (Kolektomie) bei Versagen der Therapie. Selbsthilfe: DCCV."]],
"kult":[["Praxis kultursensibler Pflege","Transkulturelle Kompetenz: Selbstreflexion, Wissen, Haltung, Fertigkeiten. Vorsicht vor Stereotypen (Kulturalisierung): immer die Person fragen. Beispiele: Fasten (Ramadan) und Medikamente/Insulin ärztlich besprechen, Speisevorschriften (halal, koscher, vegetarisch), gleichgeschlechtliche Pflege, Scham, Rituale bei Sterben und Tod, Schmerzausdruck verschieden, nicht abwerten. Kommunikation: Dolmetschende, Piktogramme, mehrsprachige Materialien. Rechtlich zählen Gleichbehandlung (AGG) und Selbstbestimmung."]],
"hilf":[["Wer zahlt wann – und der Ablauf","Krankenkasse: Hilfsmittel zur Behandlung oder Behinderungsausgleich (ärztliche Verordnung, Hilfsmittelverzeichnis, Zuzahlung). Pflegekasse: Pflegehilfsmittel bei Pflegegrad (zum Verbrauch, z. B. Handschuhe/Bettschutz; technisch, z. B. Pflegebett, Hausnotruf; Wohnumfeld-Zuschuss). Reha/Arbeitsunfall: Rentenversicherung bzw. Berufsgenossenschaft; sonst Sozialhilfe. Ablauf: Bedarf erheben → Verordnung → Kostenvoranschlag/Antrag → Bewilligung → Einweisung und Anpassung → Kontrolle. Bei Ablehnung Widerspruch, Frist laut Rechtsbehelfsbelehrung (meist 1 Monat). Beratung: § 7a SGB XI, Sanitätshaus, Pflegestützpunkt."]],
"infos":[["Assessments & saubere Dokumentation","Gängige Instrumente: Barthel-Index (Alltagsaktivitäten), Braden-Skala (Dekubitusrisiko), MNA (Mangelernährung), Sturzrisiko (z. B. Timed Up & Go), MMST (Kognition), CAM (Delir), NRS/BESD (Schmerz). Beobachtung statt Wertung dokumentieren: „lehnt Essen ab“, nicht „ist störrisch“. Eigene Worte der Person wörtlich markieren. Quellen angeben, Aktualität prüfen, Datenschutz beachten."]],
"lung":[["Diagnostik, Therapie, Symptome","Diagnostik: Röntgen/CT, Bronchoskopie mit Biopsie, Histologie, molekulare Tests. Therapie (ärztlich, Stand in der Leitlinie): OP, Strahlentherapie, Chemotherapie, zielgerichtete Therapie, Immuntherapie. Pflege bei Atemnot: Oberkörper hoch, Ruhe, frische Luft/Luftzug, Medikamente nur nach Anordnung, Angst nehmen. Husten, Schmerz, Gewichtsverlust, Mundpflege beachten. Hämoptoe (Blut im Auswurf, starke Blutung) = Notfall."],["Palliative Care in der Praxis","Therapieziel verändert sich von Heilung zu Lebensqualität; Wünsche erfragen, Patientenverfügung und Vorsorgevollmacht ansprechen. Symptome im Sterben: Rasselatmung (Positionierung, Mundpflege, ärztliche Medikation), Mundtrockenheit, Unruhe, Angst, Atemnot. Strukturen: SAPV (§ 37b SGB V), Hospiz, Palliativstation. Kommunikation: nicht ausweichen, zuhören, Anwesenheit anbieten, Angehörige einbeziehen und Trauer begleiten."]],
"exp":[["Übersicht & Aufbau","Wichtige DNQP-Standards: Dekubitusprophylaxe, Sturzprophylaxe, Schmerzmanagement, Kontinenzförderung, chronische Wunden, Ernährungsmanagement, Entlassungsmanagement, Förderung der Mobilität, Beziehungsgestaltung bei Demenz. Aufbau: Struktur (Voraussetzungen, Kompetenz, Verfahrensregel), Prozess (Einschätzung, Planung, Beratung, Durchführung, Evaluation), Ergebnis (gewünschter Effekt). Zweck: einheitliches Qualitätsniveau, Grundlage für Audit und Qualitätsprüfung. Immer prüfen, welche Fassung aktuell ist."]],
"schw":[["Praxisfälle & Grenzen","Typische Fehler: Gespräche auf dem Flur, Auskunft am Telefon ohne Identitätsprüfung, Informationen an Angehörige ohne Einwilligung, Fotos/Social Media, neugieriger Aktenzugriff. Erlaubt: Informationsweitergabe im Team nur soweit für die Versorgung nötig. Gesetzliche Meldepflichten (z. B. Infektionsschutzgesetz) gehen vor. Rechtfertigender Notstand (§ 34 StGB) nur bei gegenwärtiger erheblicher Gefahr. Verstoß nach § 203 StGB: Freiheitsstrafe bis 1 Jahr oder Geldstrafe."]],
"ber":[["Gesprächsstruktur & Rechtsgrundlagen","Struktur: Anliegen klären → Situation erfassen → Ziele → Optionen → Entscheidung → Umsetzung → Nachfrage. Techniken: Teach-back, Zielvereinbarung, leichte Sprache, Broschüren. Rechtsgrundlagen: Pflegeberatung § 7a SGB XI, Beratungseinsatz bei Pflegegeld § 37 Abs. 3 (Abstände je Pflegegrad nachlesen), Pflegekurse für Angehörige. Grenzen: Rechtsberatung und ärztliche Beratung gehören nicht zur Pflege, Entscheidung bleibt bei der Person."]],
"leuk":[["Therapie, Neutropenie, Transfusion","Akut: schnelle Verläufe mit unreifen Blasten, sofortige Therapie; chronisch: langsamer. Diagnose: Differenzialblutbild, Knochenmarkpunktion. Therapie ärztlich: Chemotherapie, zielgerichtete Mittel (z. B. bei CML), Stammzelltransplantation. Pflege: Fieber bei Neutropenie ist ein Notfall; Mundpflege bei Mukositis; ZVK/Port-Hygiene; Zytostatika nur mit Schutzkleidung. Transfusion ist ärztlich verantwortet; Pflege überwacht Vitalzeichen und Reaktionen (Fieber, Schüttelfrost, Atemnot, Hautreaktion) → stoppen, Arzt. Psychosozial: Angst, Isolation, Kinderwunsch, Sexualität ansprechen."]],
"qm":[["Instrumente & Prüfung","Struktur-, Prozess-, Ergebnisqualität (Donabedian). Instrumente: Pflegestandards, Audits, Qualitätszirkel, Beschwerdemanagement, CIRS (anonym, freiwillig, lernend), Zertifizierung. Ergebnisindikatoren: Dekubitusrate, Sturzrate. Externe Prüfung der Pflegeeinrichtungen erfolgt durch den Medizinischen Dienst. Fehlerkultur: aus Fehlern lernen statt Schuld suchen. Qualitätssicherung gehört zu den vorbehaltenen Aufgaben (§ 4 Abs. 2 Nr. 3 PflBG)."]],
"amg":[["Umgang mit Arzneimitteln","Richten und Verabreichen nach ärztlicher Anordnung, im Vier-Augen-Prinzip bei Risikomitteln. Wirkstoff vs. Handelsname, Generika. Retardtabletten nicht teilen, magensaftresistente nicht zerkleinern. Lagerung (Kühlkette, Licht), Haltbarkeit nach Anbruch beachten. Nebenwirkung vs. Wechselwirkung; Verdachtsmeldung an Arzt, Apotheke bzw. Meldesysteme (Pharmakovigilanz). Fehler sofort ärztlich melden und im Fehlermeldesystem erfassen."]],
"btm":[["Rezept, Nachweis, Vernichtung","Anlage I: nicht verkehrsfähig; Anlage II: verkehrsfähig, nicht verschreibungsfähig; Anlage III: verkehrs- und verschreibungsfähig. BtM-Rezept dreiteilig (Teile für Apotheke und Verbleib beim Arzt). Station: Bestandsbuch oder Karteikarte mit Datum, Zugang, Abgang, Bestand, Namen, Unterschriften; regelmäßige Kontrolle. Aufbewahrung verschlossen, Schlüssel in Verantwortung. Vernichtung durch zwei Personen dokumentiert. Zu Hause liegt die Verantwortung bei der betroffenen Person bzw. den Angehörigen."]],
"rolle":[["Rollenkonflikte unterscheiden","Rollenerwartung, Rollenkonflikt, Rollenambiguität (unklare Erwartung), Rollendistanz. Intrarollenkonflikt: unvereinbare Erwartungen verschiedener Bezugsgruppen an dieselbe Rolle. Interrollenkonflikt: Erwartungen verschiedener Rollen kollidieren. Person-Rolle-Konflikt: eigene Werte passen nicht zur Rollenanforderung. Umgang: Rolle und Erwartungen klären, Prioritäten setzen, Teamgespräch, Supervision, Leitung einbeziehen."]],
"sett":[["Merkmale der Settings","Akut: kurze Verweildauer, hohe Taktung, Spezialisierung, Entlassmanagement. Kurzzeitpflege (§ 42 SGB XI): befristeter Aufenthalt, Übergang oder Krise; Leistungsbeträge zusammen mit Verhinderungspflege nachlesen (Regelung seit 2025 geändert). Langzeit: Wohnen und Pflege, Lebensqualität, Bezugspflege, Landesheimrecht, Personalbemessung. Ambulant: Gast im Haushalt, SGB V (Behandlungspflege nach Verordnung) und SGB XI (Grundpflege, Sachleistung), Touren, alleine arbeiten, Angehörige einbeziehen. Dazu Tagespflege und Palliativversorgung."]],
"team":[["Zusammenarbeit im Alltag","Instrumente: Übergabe (SBAR), Visite, Fallbesprechung, Entlassmanagement (§ 39 SGB V). Qualifikationsmix in der Pflege: Fachperson, Assistenz, Praxisanleitung, Betreuungskräfte; Fachperson bleibt für Steuerung verantwortlich. Teamphasen (Tuckman): Forming, Storming, Norming, Performing. Konflikte früh ansprechen, Schnittstellen klar regeln, Entscheidungen dokumentieren."]],
"bel":[["Modelle & Prävention","Burnout (Maslach): Erschöpfung, Distanzierung/Zynismus, nachlassende Leistung. Mitgefühlsmüdigkeit und moralischer Stress. Stressmodell Lazarus: Bewertung und Bewältigung. Salutogenese (Antonovsky): Kohärenzgefühl aus Verstehbarkeit, Handhabbarkeit, Bedeutsamkeit. Verhältnisprävention (Dienstplan, Personal, Hilfsmittel) vor Verhaltensprävention (Entspannung, Rückenschule). Schichtdienst: Ruhezeiten einhalten, planbare Pläne. Hilfen: kollegiale Beratung, Supervision, Betriebsarzt, Gesundheitsförderung."]],
"ausl":[["Anerkennung, Anwerbung, Integration","EU-Abschlüsse werden meist vereinfacht anerkannt; bei Drittstaaten Gleichwertigkeitsprüfung, bei Defiziten Anpassungslehrgang oder Kenntnisprüfung. Sprache: i. d. R. B2 mit Fachsprache (Länderregeln). Anwerbung über Vermittlungsprogramme/Agenturen; Visum nach dem Fachkräfteeinwanderungsgesetz. Ethik: WHO-Kodex gegen Abwerbung aus Ländern mit Personalmangel. Integration: strukturierte Einarbeitung, Mentoring, Sprachförderung, Wohnen und Behörden, Wertschätzung. Risiken: Überforderung, Diskriminierung, Fluktuation. Regeln ändern sich, aktuelle Seiten nutzen."]],
"pflbg":[["Ausbildung & Prüfung","3 Jahre Vollzeit (Teilzeit bis 5 Jahre), mindestens 2.100 Stunden Unterricht und 2.500 Stunden praktische Ausbildung. Pflichteinsätze: stationäre Akutpflege, stationäre Langzeitpflege, ambulante Pflege, pädiatrisch, psychiatrisch; Orientierungs- und Vertiefungseinsatz. Praxisanleitung mindestens 10 % der Einsatzzeit. Abschluss: staatliche Prüfung (schriftlich, mündlich, praktisch). Ausbildungsvergütung, kein Schulgeld, Finanzierung über Ausbildungsfonds. Daneben primärqualifizierendes Pflegestudium. Berufsbezeichnung Pflegefachfrau/Pflegefachmann ist geschützt."]],
"hyg":[["MRSA und Noro","MRSA: Screening bei Risiko, Kontaktisolierung, Sanierung nach ärztlicher Anordnung, Schutzkittel, Handschuhe, ggf. Mund-Nasen-Schutz, patientenbezogene Materialien. Noro: sehr ansteckend (Erbrechen, Durchfall), Kontaktisolierung, Händedesinfektion mit gegen Noroviren wirksamem Mittel nach Herstellerangabe, Flächendesinfektion, Besuch einschränken. Meldepflichten nach Infektionsschutzgesetz beachten und Hygienebeauftragte einbeziehen."]],
"dm":[["Diabetisches Fußsyndrom und Insulin","Nervenschäden und Durchblutungsstörung lassen Wunden unbemerkt bleiben. Täglich Füße inspizieren (Druckstellen, Risse, Rötung), nicht barfuß gehen, keine Hornhaut selbst schneiden, Fußpflege durch Fachpersonal, Wunden ärztlich abklären. Insulin: Injektionsstellen wechseln (Lipohypertrophie vermeiden), Insulinart (schnell oder lang wirksam) und Essenszeitpunkt beachten, nie ohne Anordnung ändern."]],
"dem":[["Umgang im Alltag","Tagesstruktur und Rituale, Biografiearbeit (Lieblingsmusik, Beruf, Gewohnheiten), vertraute Gegenstände, Orientierungshilfen (Uhr, Beschilderung), ausreichend Bewegung, Reizüberflutung vermeiden. Bei Unruhe zuerst Ursachen prüfen (Schmerz, Toilette, Hunger, Durst). Angehörige entlasten und beraten (Pflegekurse, Beratung nach § 7a SGB XI)."]]
};

<script>
/* Zusätzliche Vertiefung: "Verstehen: Warum?" – Ursache und Wirkung statt Auswendiglernen. */
var DX={
"komm":[["Verstehen: Warum entstehen Missverständnisse?","Sender und Empfänger haben jeweils vier „Schnäbel“ bzw. „Ohren“. Der Sender sendet meist auf einer Ebene, der Empfänger hört oft auf der Ebene, die ihm gerade am wichtigsten ist (wer sich unsicher fühlt, hört schnell Beziehung/Vorwurf). Deshalb: Nachfragen („Wie meinst du das?“), Ich-Botschaften (beschreiben, was ich wahrnehme und brauche, statt zu bewerten) und Paraphrasieren (Gehörtes in eigenen Worten wiedergeben) machen unklare Ebenen sichtbar. Bei Demenz funktioniert Korrigieren nicht, weil das Kurzzeitgedächtnis die Korrektur nicht behält, das Gefühl der Bloßstellung aber bleibt. Validation erreicht die emotionale Ebene, die noch intakt ist. Bei der Übergabe verhindert SBAR, dass wichtige Informationen untergehen, weil jede Person die gleiche Reihenfolge erwartet."]],
"proph":[["Verstehen: Was steckt hinter den Prophylaxen?","Fast alle Prophylaxen verhindern die Folgen von Immobilität und Risiko. Dekubitus entsteht, wenn Druck die Durchblutung der Haut stoppt, bis Gewebe ohne Sauerstoff abstirbt; deshalb entlastet man Druck (Schräglage, Fersen frei) und massiert nicht (geschädigte Kapillaren). Thrombose: Virchow-Trias, also Gefäßwand, langsamer Blutfluss, Gerinnung. Bewegung bringt den Blutfluss in Gang. Gefahr: Ein Gerinnsel löst sich und wandert als Lungenembolie in die Lunge, daher nicht massieren. Pneumonie: Flache Atmung und Sekret in unbelüfteten Lungenabschnitten bieten Keimen einen Nährboden; Atemtraining, Mobilisation und Oberkörperhochlagerung belüften die Lunge. Sturz: Risikofaktoren erkennen (innen und außen) statt Fixieren, weil Fixierung Muskelabbau, Angst und sogar Verletzungen verursachen kann."]],
"div":[["Verstehen: Von der Divertikulose zur Komplikation","Durch Druck im Darm (wenig Ballaststoffe, harter Stuhl, Verstopfung) stülpt sich die Darmwand an Schwachstellen aus: Divertikulose. Bleibt Stuhl in der Ausstülpung hängen, kann sie sich entzünden: Divertikulitis. Das Sigma ist am häufigsten betroffen, weil dort der Darm am engsten ist und der Druck am höchsten, daher der Schmerz links unten. Entzündet sich die Wand stark, kann sie durchbrechen: Abszess oder Perforation mit Peritonitis. Deshalb sind bretthartes Abdomen, hohes Fieber und Kreislaufabfall Alarmzeichen. Koloskopie im Schub vermeidet man, weil Luft und Instrument eine entzündete Wand perforieren können. Ballaststoffe und Flüssigkeit machen den Stuhl weich und senken den Druck."]],
"stoma":[["Verstehen: Warum so und nicht anders?","Der Dünndarm resorbiert Wasser und Nährstoffe, der Dickdarm entzieht dem Stuhl Wasser. Beim Ileostoma fehlt der Dickdarm, daher ist der Stuhl flüssig, enthält Verdauungsenzyme und greift die Haut an (Hautschutz!) und es besteht Dehydratationsgefahr. Eine zu große Öffnung in der Platte lässt Stuhl an die Haut: Mazeration. Eine zu enge Öffnung drückt auf das Stoma und stört die Durchblutung. Die Schleimhaut ist rosig-rot, weil sie gut durchblutet ist; blass, blau oder schwarz zeigt Minderdurchblutung bis Absterben, also Arzt. Schwer heben vermeidet die parastomale Hernie, weil der erhöhte Bauchdruck die Bauchwand an der Stomaöffnung schwächt."]],
"zvk":[["Verstehen: Risiken und Konsequenzen","Ein ZVK ist eine direkte Verbindung zwischen Außenwelt und Blutbahn. Keime, die über Konnektoren, Verband oder Einstichstelle eindringen, erreichen sofort den Kreislauf: Katheterinfektion/Sepsis. Daher Händedesinfektion, Konnektoren desinfizieren und aseptisches Arbeiten. Die Lagekontrolle verhindert, dass Infusionen an der falschen Stelle landen (Fehllage, Pneumothorax). Bei der Sondenkost soll der Oberkörper erhöht sein, weil Mageninhalt sonst bei flacher Lage zurück in die Speiseröhre laufen und in die Luftwege gelangen kann (Aspiration, Pneumonie). Spülen vor und nach Gabe verhindert Verstopfen der Sonde. Retardtabletten nicht zerkleinern, weil sonst der Wirkstoff auf einmal freigesetzt wird. Prinzip der Ernährung: so natürlich wie möglich, weil der Darm Barriere und Immunsystem erhält."]],
"cu":[["Verstehen: Colitis ulcerosa und Morbus Crohn unterscheiden","Beide sind chronisch-entzündliche Darmerkrankungen (autoimmun-ähnlich, in Schüben). Die CU beginnt im Rektum und breitet sich kontinuierlich nach oben aus, bleibt im Dickdarm und in der Schleimhaut. Dadurch entstehen blutig-schleimige Durchfälle und Tenesmen (schmerzhafter Stuhldrang, weil das Rektum entzündet ist). Bei Crohn können alle Abschnitte vom Mund bis After segmental befallen sein, alle Wandschichten (transmural), daher Fisteln und Stenosen. Der Flüssigkeits- und Elektrolytverlust durch Durchfall ist das pflegerische Hauptproblem. Kortison dämpft das Immunsystem (Infektionsrisiko), Biologika ebenfalls. Toxisches Megakolon: Die Darmwand erschlafft und weitet sich, Perforationsgefahr. Darmkrebsrisiko steigt bei langjähriger Entzündung, deshalb Koloskopien."]],
"kult":[["Verstehen: Was kultursensibel wirklich heißt","Kultursensible Pflege heißt nicht, Regeln einer „Kultur“ auswendig zu lernen. Menschen innerhalb einer Kultur unterscheiden sich stark (Religiosität, Generation, Bildung, Migrationsgeschichte). Wer pauschal annimmt, begeht eine Kulturalisierung. Besser: nach Bedürfnissen fragen, Sprache sicherstellen und eigene Vorannahmen reflektieren. Dolmetschen durch Kinder überfordert sie und kann Inhalte verfälschen, außerdem ist Intimes betroffen (Schweigepflicht, Scham). Professionelle Sprachmittlung sichert Verständnis und Datenschutz. Leiningers Sunrise-Modell zeigt, dass Pflege Bereiche wie Religion, Verwandtschaft, Werte, Politik, Wirtschaft und Bildung einbezieht."]],
"copd":[["Verstehen: Warum Lippenbremse, Kutschersitz und dosierter Sauerstoff?","Bei COPD sind die Atemwege dauerhaft verengt und die Lungenbläschen überbläht; Ausatmen fällt schwer, Luft bleibt in der Lunge. Die Lippenbremse erzeugt beim Ausatmen einen Gegendruck, der die kleinen Bronchien offen hält, sodass mehr verbrauchte Luft entweichen kann. Kutschersitz und Oberkörper hoch entlasten die Atemhilfsmuskulatur. Warum dosierter Sauerstoff? Menschen mit langjähriger COPD haben oft erhöhtes CO2 und atmen teilweise wegen niedrigen Sauerstoffs. Zu viel Sauerstoff kann den Atemantrieb dämpfen, CO2 steigt (Retention). Zeichen: Müdigkeit, Kopfschmerz, Verwirrtheit. Nach inhalativem Kortison Mund spülen, damit sich in der Mundschleimhaut kein Pilz (Soor) bildet. Rauchstopp bremst das Fortschreiten am wirksamsten."]],
"hilf":[["Verstehen: Wer zahlt was und warum?","Die Zuständigkeit richtet sich nach dem Zweck: Hilft das Hilfsmittel bei Behandlung oder gleicht es eine Behinderung aus (Rollator, Hörgerät), zahlt die Krankenkasse nach ärztlicher Verordnung (§ 33 SGB V). Erleichtert es die Pflege oder die Selbstständigkeit im Alltag (Pflegebett, Hausnotruf, Bettschutz zum Verbrauch), zahlt die Pflegekasse bei Pflegegrad (§ 40 SGB XI). Das Hilfsmittelverzeichnis zeigt zugelassene Produkte. Abgelehnt? Ein Widerspruch ist möglich, weil Bescheide mit Rechtsbehelfsbelehrung erlassen werden und die Frist meist einen Monat beträgt. Pflegefachpersonen beraten und leiten an, die Verordnung bleibt ärztlich (bzw. die Neuerungen aus BEEP dazu selbst nachlesen)."]],
"pp":[["Verstehen: Warum ein Regelkreis?","Der Pflegeprozess verhindert, dass Pflege zufällig oder nach Routine abläuft. Informationen sammeln liefert die Grundlage; ohne sie ist das Problem falsch eingeschätzt. Ressourcen sind ebenso wichtig wie Probleme, weil sie Selbstständigkeit erhalten. Das Ziel beschreibt, was die Person erreichen soll (nicht, was die Pflegekraft tut) und muss überprüfbar sein, sonst lässt sich die Evaluation nicht durchführen. Evaluation fragt: Ziel erreicht? Wenn nicht, warum? Daraus entsteht neue Planung: der Kreis schließt sich. Fiechter und Meier haben sechs Schritte, weil sie die Schritte „Probleme/Ressourcen“ und „Ziele“ getrennt betrachten; die WHO fasst vier zusammen. Dokumentation macht den Prozess nachvollziehbar, auch rechtlich."]],
"infos":[["Verstehen: Was gute Informationssammlung ausmacht","Die Informationssammlung bildet die Basis aller weiteren Schritte. Objektive Daten (messbar, beobachtbar, z. B. Blutdruck, Gewicht) und subjektive Daten (Empfinden, z. B. Angst, Schmerz) trennt man, damit eine Wertung nicht als Tatsache missverstanden wird. Die Person selbst ist die wichtigste Quelle, weil nur sie ihr Erleben kennt; Angehörige und Akten ergänzen. Assessments (Braden, Barthel, MNA) machen Einschätzungen vergleichbar. Das Strukturmodell (SIS) fragt zuerst die Sicht der Person und ordnet danach in sechs Themenfelder, damit Dokumentation schlank bleibt und Risiken (z. B. Sturz, Dekubitus) gezielt eingeschätzt werden."]],
"schm":[["Verstehen: Warum Schmerz ernst nehmen und wie man ihn erfasst","Schmerz ist subjektiv: Er ist das, was die Person angibt. Deshalb ist die Selbstauskunft (NRS, VAS) die erste Wahl. Bei Demenz oder Aphasie fehlt sie, daher Beobachtungsinstrumente wie BESD (Mimik, Lautäußerung, Körpersprache, Trost). Unruhe oder Rückzug können Schmerz bedeuten. Akuter Schmerz warnt, chronischer (länger als 3 Monate) hat seine Warnfunktion verloren und verändert Schlaf, Stimmung und Alltag. Das WHO-Schema schreitet nach der Stärke fort; „nach Uhrzeit“ heißt, vor dem nächsten Schmerz zu geben, damit er nicht erst entsteht. Opioide verlangsamen den Darm: Obstipationsprophylaxe. Pflege erfasst, setzt Anordnungen um, beobachtet Wirkung und Nebenwirkung, ergänzt nicht-medikamentös (Lagerung, Wärme) und informiert den Arzt."]],
"lung":[["Verstehen: Lungenkarzinom und Palliative Care","Rauchen schädigt Bronchialschleimhaut über Jahre, aus entarteten Zellen kann ein Karzinom entstehen. Symptome bleiben lange unspezifisch (Husten, Gewichtsverlust), daher oft später Diagnose. Kleinzellige Karzinome wachsen schnell und streuen früh, nicht-kleinzellige sind häufiger. Palliative Care heißt nicht „nichts mehr tun“: Sie lindert Symptome (Atemnot, Schmerz, Angst), stärkt Lebensqualität und bezieht Angehörige ein, und zwar früh im Verlauf. Atemnot lindert man durch Oberkörper hoch, Luftzug, Ruhe, ärztlich angeordnete Medikamente und Anwesenheit; Angst verstärkt Atemnot. Patientenverfügung und Vorsorgevollmacht sichern den Willen der Person, wenn sie nicht mehr entscheiden kann."]],
"exp":[["Verstehen: Wozu Expertenstandards?","Pflege soll nicht davon abhängen, wer gerade Dienst hat. Expertenstandards bündeln den besten Wissensstand (Evidenz und Expertenkonsens) zu einem Pflegethema und legen Kriterien fest: Struktur (Voraussetzungen, z. B. Kompetenz, Verfahrensregel), Prozess (Einschätzen, Planen, Beraten, Durchführen, Evaluieren) und Ergebnis (gewünschter Effekt, z. B. kein Dekubitus). Dadurch lassen sich Qualität prüfen (Audit) und Entwicklung steuern. Sie sind Fachstandards, keine Gesetze, wirken aber über § 113a SGB XI und Haftung (Maßstab der Sorgfalt). Beim Schmerzmanagement: Screening, Assessment, Maßnahmenplanung, Beratung, Evaluation."]],
"schw":[["Verstehen: Warum Schweigepflicht und wo ihre Grenzen liegen","Pflegebedürftige vertrauen intimste Informationen an; ohne Vertraulichkeit würden sie wichtige Dinge verschweigen. § 203 StGB schützt dieses Vertrauen, die Verletzung ist strafbar. Offenbarung ist erlaubt, wenn die Person einwilligt oder entbindet, wenn das Gesetz es verlangt (z. B. Meldepflicht nach Infektionsschutzgesetz) oder wenn ein rechtfertigender Notstand vorliegt (§ 34 StGB: erhebliche gegenwärtige Gefahr, Abwägung). Auch Angehörige sind „Dritte“, deshalb am Telefon ohne Einwilligung keine Auskunft. Im Team ist die Weitergabe zulässig, soweit sie für die Versorgung erforderlich ist. Praktisch: nicht auf dem Flur sprechen, keine Fotos, Akten nur bei Bedarf einsehen."]],
"ber":[["Verstehen: Information, Anleitung, Schulung, Beratung","Die vier Formen lassen sich nach dem Ziel unterscheiden: Information vermittelt Wissen (einseitig), Anleitung übt eine Handlung (z. B. Insulin spritzen), Schulung ist ein geplantes, strukturiertes Programm für Gruppen, Beratung unterstützt Entscheidungen im Gespräch, die Person entscheidet selbst. Beratung braucht Zeit, offene Fragen und Zuhören, weil sie Probleme und Ressourcen erst erfragt. Teach-back prüft, ob Information wirklich verstanden wurde; ein bloßes „Alles klar?“ zeigt das nicht. Rechtlich: Pflegeberatung (§ 7a SGB XI) und Beratungseinsatz bei Pflegegeld (§ 37 Abs. 3 SGB XI) sichern Qualität der häuslichen Pflege."]],
"leuk":[["Verstehen: Warum Anämie, Infekte und Blutungen?","Im Knochenmark vermehren sich bei Leukämie unreife, funktionslose weiße Blutzellen (Blasten) unkontrolliert und verdrängen die normale Blutbildung. Es fehlen Erythrozyten (Anämie: Blässe, Müdigkeit, Atemnot bei Belastung), funktionstüchtige Leukozyten (Infekte, bei Neutropenie ist Fieber ein Notfall) und Thrombozyten (Blutungsneigung, Petechien, Zahnfleischbluten). Pflege folgt dem Mangel: Infektionsschutz, schonende Mundpflege (Mukositis), keine i.m.-Injektionen, weiche Zahnbürste, Elektrorasierer, Sturzvermeidung. Akute Formen entwickeln sich schnell, chronische langsam. Chemotherapie trifft auch gesunde, sich schnell teilende Zellen: Haarausfall, Mukositis, Übelkeit."]],
"epi":[["Verstehen: Was im Anfall passiert und warum man so handelt","Ein Anfall ist eine plötzliche, übermäßige Entladung von Nervenzellen. Beim tonisch-klonischen Anfall verkrampft der Körper, dann zuckt er; in dieser Zeit ist die Atmung gestört, aber der Anfall lässt von selbst nach. Man kann ihn nicht abbrechen; Festhalten verletzt. Nichts in den Mund legen, weil man Zähne und Atemwege verletzen kann und der Zungenbiss meist schon passiert ist. Schutz vor Verletzung, Zeit messen und beobachten sind das Wichtigste. Nach dem Anfall folgt die postiktale Phase (Müdigkeit, Verwirrtheit): stabile Seitenlage, Atmung beobachten. Länger als 5 Minuten oder Serie ist ein Status epilepticus: lebensbedrohlich, Notruf. Regelmäßige Medikamente verhindern Anfälle, deshalb nicht eigenmächtig absetzen."]],
"qm":[["Verstehen: Qualität sichtbar machen","Qualität lässt sich nur verbessern, wenn man sie beschreibt und misst. Donabedian trennt: Struktur (Rahmen: Personal, Ausstattung), Prozess (Abläufe: Standards, Dokumentation) und Ergebnis (Wirkung: Dekubitusrate, Zufriedenheit). Der PDCA-Zyklus macht daraus ein Dauerprogramm: Plan, Do, Check (Wirkung überprüfen), Act (anpassen). CIRS ist anonym und freiwillig, damit Fehler gemeldet werden, statt Schuld zu suchen: Aus Beinahe-Fehlern lernt das System. Audits und Medizinischer Dienst prüfen extern. Qualitätsentwicklung ist eine vorbehaltene Aufgabe der Pflegefachperson (§ 4 PflBG)."]],
"amg":[["Verstehen: Sicherheit bei Arzneimitteln","Das Arzneimittelgesetz schützt vor unwirksamen oder schädlichen Arzneimitteln (Zulassung, Herstellung, Abgabe, Überwachung). Für die Pflege bedeutet das: nur nach ärztlicher Anordnung geben (Anordnungsverantwortung ärztlich, Durchführungsverantwortung pflegerisch). Die 6-R-Regel sichert gegen die häufigsten Fehler: falsche Person, falsches Medikament, falsche Dosis, falscher Weg, falscher Zeitpunkt, fehlende Dokumentation. Das Vier-Augen-Prinzip senkt Fehler bei Risikomitteln. Retardtabletten nicht teilen: Der Wirkstoff würde auf einmal frei. Magensaftresistente nicht zerkleinern: Sie sollen sich erst im Darm lösen. Nebenwirkungen erkennt man nur, wenn man beobachtet; Meldung dient der Arzneimittelsicherheit."]],
"btm":[["Verstehen: Warum besondere Regeln für BtM?","Betäubungsmittel wirken stark (z. B. Opioide), haben Missbrauchs- und Abhängigkeitspotenzial und können tödlich sein. Deshalb gelten strenge Regeln: eigenes Rezept, verschlossene Aufbewahrung, lückenlose Nachweisführung (Bestandsbuch), regelmäßige Kontrolle und Vernichtung zu zweit. Die Nachvollziehbarkeit schützt Patientinnen und Patienten und auch das Personal: Jede Menge ist belegbar. Stimmt der Bestand nicht, wird nichts „korrigiert“, sondern Leitung und Verantwortliche informiert. Zu Hause liegt die Verantwortung bei der betroffenen Person bzw. den Angehörigen."]],
"del":[["Verstehen: Wer ist wofür verantwortlich?","Medizinische Tätigkeiten sind grundsätzlich ärztlich, können aber delegiert werden. Die ärztliche Person trägt die Anordnungsverantwortung (Auswahl der Person, Anweisung, Überwachung). Die Pflegefachperson trägt die Durchführungsverantwortung: Sie muss prüfen, ob sie dazu qualifiziert ist. Fehlt Qualifikation und sie führt trotzdem durch, liegt Übernahmeverschulden vor. Deshalb gibt es die Remonstration (Bedenken äußern, ablehnen). Nicht delegierbar sind Diagnose, Indikationsstellung, Therapieentscheidung. Davon zu trennen: Delegation pflegerischer Aufgaben an Pflegeassistenz, wobei die Pflegefachperson verantwortlich bleibt; und neu geregelte eigenverantwortliche Heilkunde (Substitution), dazu die aktuelle Gesetzesfassung nachlesen."]],
"rolle":[["Verstehen: Rollen und Rollenkonflikte","Eine Rolle ist ein Bündel von Erwartungen, das andere an eine Position richten. Pflegende haben viele Bezugsgruppen (Patient, Angehörige, Team, Leitung, Arzt), jede mit eigenen Erwartungen: Das ergibt den Intrarollenkonflikt. Der Interrollenkonflikt entsteht zwischen zwei Rollen derselben Person (Pflegekraft und Mutter). Bei Rollenambiguität sind Erwartungen unklar. Der Person-Rolle-Konflikt entsteht, wenn eigene Werte nicht zur Rolle passen. Umgang: Erwartungen klären, Prioritäten setzen (Sicherheit zuerst), im Team besprechen, Supervision nutzen. Rollen Pflegender: Pflegeexpertin, Beraterin, Advocacy (Anwaltschaft), Teammitglied, Lehrende, Managerin."]],
"sett":[["Verstehen: Warum unterscheiden sich die Settings?","Der Auftrag bestimmt die Pflege. Akut: Diagnostik und Therapie, rasche Entlassung, hohe Taktung. Kurzzeitpflege: befristeter Übergang nach Klinik oder bei Krise (§ 42 SGB XI) mit dem Ziel, zurück nach Hause zu kommen. Langzeit: Pflege ist Zuhause, deshalb Beziehung, Alltagsgestaltung und Lebensqualität (Bezugspflege). Ambulant: Die Pflegekraft ist Gast im Haushalt der Person, arbeitet meist allein, Angehörige sind wichtige Partner; die Finanzierung teilt sich auf (SGB V: Behandlungspflege nach Verordnung; SGB XI: Grundpflege als Sachleistung). Entlassmanagement (§ 39 SGB V) verbindet die Settings, damit nach der Klinik nahtlos versorgt wird."]],
"team":[["Verstehen: Zusammenarbeit, die funktioniert","Intradisziplinär heißt innerhalb der Pflege (Fachperson, Assistenz, Praxisanleitung), interdisziplinär zwischen Berufsgruppen (Pflege, Medizin, Physio, Sozialdienst). Probleme entstehen an Schnittstellen, wenn Informationen verloren gehen. SBAR strukturiert die Übergabe (Situation, Background, Assessment, Recommendation), Visite und Fallbesprechung bringen Perspektiven zusammen. Teams durchlaufen Phasen nach Tuckman: Forming, Storming (Konflikte sind normal), Norming, Performing. Konflikte spricht man früh und sachlich an, mit Ich-Botschaften. Der Qualifikationsmix funktioniert nur, wenn Aufgaben klar verteilt sind und die Fachperson steuert."]],
"bel":[["Verstehen: Belastung, Burnout und Gegenmittel","Belastungen entstehen aus Anforderungen, denen zu wenige Ressourcen gegenüberstehen. Körperlich: Heben, Schicht. Psychisch: Tod, Zeitdruck, Gewalt, moralischer Stress. Dauerhafte Überlastung kann in Burnout münden (Erschöpfung, Zynismus, Leistungsabfall nach Maslach). Verhältnisprävention (bessere Dienstpläne, Personal, Hilfsmittel) setzt an den Arbeitsbedingungen an und wirkt bei allen; Verhaltensprävention (Entspannung, Rückenschule) an der einzelnen Person. Salutogenese (Antonovsky) fragt, was gesund hält: Verstehbarkeit, Handhabbarkeit, Bedeutsamkeit. Arbeitgeber müssen Gefährdungen beurteilen (ArbSchG), auch psychische."]],
"ausl":[["Verstehen: Fachkräfte gewinnen und integrieren","Der Fachkräftemangel führt zur Anwerbung aus dem Ausland. Voraussetzungen sind Anerkennung (Gleichwertigkeit der Ausbildung, ggf. Anpassungsmaßnahme/Kenntnisprüfung) und Sprache (B2 plus Fachsprache, weil Pflege auf genauer Verständigung beruht: Medikamente, Übergabe). Ethisch problematisch ist die Abwerbung aus Ländern mit eigenem Personalmangel; der WHO-Kodex verlangt fairen Umgang. Integration gelingt mit Einarbeitung, Mentoring, Sprachförderung, Unterstützung bei Wohnen und Behörden und einem respektvollen Team. Ohne diese Unterstützung drohen Überforderung, Diskriminierung und hohe Fluktuation."]],
"pflbg":[["Verstehen: Was das Pflegeberufegesetz regelt","Das PflBG führte 2020 die generalistische Ausbildung ein: Statt getrennter Ausbildungen gibt es eine gemeinsame, damit Pflegefachpersonen in allen Settings arbeiten können. Die Ausbildung dauert 3 Jahre in Vollzeit mit Theorie und Praxis in verschiedenen Einsätzen. Vorbehaltene Aufgaben (§ 4) sichern, dass zentrale Verantwortung für den Pflegeprozess bei qualifizierten Personen liegt: Pflegebedarf erheben und feststellen, Prozess organisieren, gestalten und steuern, Qualität analysieren, evaluieren, sichern und entwickeln. Sie dürfen nicht an Personen ohne Erlaubnis übertragen werden. Aktuelle Änderungen (z. B. neuer § 4a) bitte im Gesetzestext und bei der Schule nachlesen."]]

"komm":[
["Erkläre das Vier-Seiten-Modell von Schulz von Thun und gib ein Beispiel aus dem Pflegealltag.","Jede Nachricht hat vier Seiten: die Sachebene (worüber ich informiere), die Selbstoffenbarung (was ich von mir preisgebe), die Beziehungsebene (wie ich zu dir stehe) und die Appellebene (was ich bei dir erreichen möchte). Beispiel: „Die Infusion ist durchgelaufen“ ist als Sachinformation gemeint, kann aber als Vorwurf auf der Beziehungsebene ankommen. Missverständnisse entstehen, wenn Sender und Empfänger auf verschiedenen Ebenen sprechen und hören.",["sachebene|sachinhalt","selbstoffenbarung","beziehung","appell","vier","missverst"]],
["Fall: Frau Berger, 84, hat eine Demenz und sagt jeden Morgen, sie müsse zu ihren Kindern, die warteten auf sie. Die Kinder sind längst erwachsen. Wie reagierst du und warum?","Ich reagiere validierend: Ich nehme das Gefühl hinter der Aussage ernst (Sorge, Verantwortung), widerspreche nicht und korrigiere nicht. Ich frage nach den Kindern und lasse sie erzählen, nutze Biografie und Rituale. Ich prüfe Ursachen von Unruhe wie Schmerz, Toilette, Hunger oder Angst. Danach biete ich sanft eine Beschäftigung an. Angehörige berate ich zum Umgang.",["validier|gefuhl","widerspr|korrigier","nachfrag|erzahl","biograf","schmerz|toilette|bedurfnis","angehorig"]]
],
"exp":[
["Was ist ein Expertenstandard und wie ist er aufgebaut?","Ein Expertenstandard ist ein evidenzbasiertes, berufsgruppenübergreifend konsentiertes Instrument des DNQP zur Qualitätsentwicklung. Er besteht aus Struktur-, Prozess- und Ergebniskriterien mit Begründung und Kommentierung. Er dient als Grundlage für Audits. In der Langzeitpflege ist er über § 113a SGB XI besonders relevant.",["dnqp","struktur","prozess","ergebnis","qualitat","113a|audit"]],
["Fall: Herr Peters, 78, liegt nach einem Schlaganfall überwiegend im Bett. Welchen Expertenstandard ziehst du heran und wie gehst du vor?","Ich ziehe den Expertenstandard Dekubitusprophylaxe heran. Zuerst schätze ich das Risiko ein und inspiziere die Haut. Dann plane ich Bewegungsförderung und Druckentlastung (30°-Schräglage, Fersen frei, geeignete Matratze). Ich berate Herrn Peters und die Angehörigen und überprüfe die Wirkung. Wenn nötig, passe ich die Planung an.",["dekubitus","risiko","haut","druckentlast|lager|mobilis","berate|beratung|anleitung","evaluation|uberpruf|wirkung"]]
],
"schw":[
["Was bedeutet Schweigepflicht für Pflegefachpersonen und wann darf sie durchbrochen werden?","Nach § 203 StGB ist die unbefugte Offenbarung fremder Geheimnisse strafbar, auch gegenüber Angehörigen und über den Tod hinaus. Offenbaren darf ich mit Einwilligung bzw. Entbindung durch die Person, bei gesetzlichen Meldepflichten oder im rechtfertigenden Notstand (§ 34 StGB). Im Team teile ich nur, was für die Versorgung nötig ist.",["203","einwillig|entbind","meldepflicht|gesetzlich","notstand|34","team|versorgung"]],
["Fall: Die Tochter eines Patienten ruft an und möchte wissen, wie es dem Vater geht und welche Diagnose er hat. Was tust du?","Am Telefon kann ich die Identität nicht sicher prüfen. Ohne Einwilligung des Patienten gebe ich keine Auskunft. Ich prüfe, ob eine Einwilligung oder Auskunftsberechtigung dokumentiert ist. Sonst biete ich an, dass der Patient selbst zurückruft oder die Tochter informiert. Ich bleibe freundlich und dokumentiere den Anruf.",["einwillig","identit","keine auskunft|keine information","patient","dokument"]]
],
"qm":[
["Erkläre die Qualitätsdimensionen nach Donabedian und den PDCA-Zyklus.","Donabedian unterscheidet Struktur-, Prozess- und Ergebnisqualität. Der PDCA-Zyklus ist ein Regelkreis zur kontinuierlichen Verbesserung: Plan (planen), Do (umsetzen), Check (überprüfen), Act (anpassen und standardisieren).",["struktur","prozess","ergebnis","plan","do|umsetz","check|uberpruf","act|anpass|handeln"]],
["Fall: Auf deiner Station gab es in einem Monat drei Stürze. Wie gehst du qualitätsorientiert vor?","Ich erfasse die Stürze und analysiere Ursachen wie Risikofaktoren, Medikamente und Umgebung. Dann plane ich Maßnahmen nach dem Expertenstandard Sturzprophylaxe und setze sie um. Danach überprüfe ich die Wirkung, z. B. über die Sturzrate. Ich nutze das Fehlermeldesystem CIRS und bespreche die Ergebnisse im Team.",["analys|ursach","expertenstandard|sturzprophylaxe","massnahme","evaluation|uberpruf|kontroll","cirs|fehlermelde","team"]]
],
"amg":[
["Was musst du beim Richten und Verabreichen von Medikamenten beachten?","Ich arbeite nach der 6-R-Regel: richtige Person, richtiges Arzneimittel, richtige Dosis, richtige Applikation, richtiger Zeitpunkt, richtige Dokumentation. Grundlage ist eine schriftliche ärztliche Anordnung. Ich prüfe Verfalldatum und Aussehen, beobachte Nebenwirkungen und melde sie.",["person","arzneimittel|medikament","dosis","applikation","zeit","dokumentation","anordnung"]],
["Fall: Nach der Gabe merkst du, dass du Frau K. versehentlich das Medikament der Zimmernachbarin gegeben hast. Was tust du?","Ich beobachte Frau K. und kontrolliere die Vitalzeichen. Sofort informiere ich die ärztliche Person und setze Gegenmaßnahmen nach Anordnung um. Ich dokumentiere den Vorfall, informiere die Leitung und nutze das Fehlermeldesystem. Ich verschweige nichts und analysiere mit dem Team, wie es dazu kam.",["arzt","beobacht|vitalzeichen","dokument","fehlermelde|cirs","leitung","verschweig|offen"]]
],
"btm":[
["Wie gehst du mit Betäubungsmitteln auf der Station um?","BtM bewahre ich verschlossen und gegen unbefugte Entnahme gesichert auf. Zugang, Abgang und Bestand weise ich lückenlos im Bestandsbuch nach, der Bestand wird regelmäßig kontrolliert. Verschrieben werden BtM auf BtM-Rezept durch Berechtigte. Die Vernichtung erfolgt durch zwei Personen und wird dokumentiert.",["verschlossen|gesichert","bestandsbuch|karteikarte|nachweis","kontroll","rezept","vernichtung|zwei"]],
["Fall: Bei der Kontrolle stimmt der BtM-Bestand nicht mit dem Bestandsbuch überein. Wie reagierst du?","Ich zähle den Bestand erneut und prüfe die letzten Einträge im Vier-Augen-Prinzip. Ich korrigiere nichts heimlich. Ich informiere die Stationsleitung und die verantwortliche Person bzw. Apotheke und dokumentiere den Vorgang. Die Ursache wird geklärt, Meldungen erfolgen nach den internen und rechtlichen Vorgaben.",["zahl|nachprüf|kontrolli","leitung","dokument","nicht korrigier|nicht vertusch|heimlich","meld"]]
],
"del":[
["Was bedeutet Delegation und wer trägt welche Verantwortung?","Bei der Delegation überträgt die ärztliche Person eine Aufgabe an die Pflege. Sie trägt die Anordnungsverantwortung, die Pflegefachperson trägt die Durchführungsverantwortung. Voraussetzungen sind Qualifikation, klare Anordnung und Einweisung. Bei Zweifeln gilt die Remonstrationspflicht. Nicht delegierbar sind Diagnose, Indikationsstellung und Therapieentscheidung.",["anordnungsverantwortung","durchfuhrungsverantwortung","qualifikation","einweisung","remonstration|bedenken","diagnose|nicht delegierbar"]],
["Fall: Die Ärztin ordnet an, bei Herrn D. einen Blasenkatheter zu legen. Du hast das noch nie selbst gemacht. Was tust du?","Ich trage die Durchführungsverantwortung und darf nicht ohne Qualifikation übernehmen, sonst droht Übernahmeverschulden. Ich äußere meine Bedenken (Remonstration) und lasse mich von einer erfahrenen Person einweisen oder anleiten. Ich informiere den Patienten und dokumentiere.",["remonstr|bedenken","einweis|anleit","qualifikation","ubernahmeverschulden|verantwortung","dokument"]]
],
"rolle":[
["Was ist ein Intrarollenkonflikt und wie unterscheidet er sich vom Interrollenkonflikt?","Beim Intrarollenkonflikt stellen verschiedene Bezugsgruppen unvereinbare Erwartungen an dieselbe Rolle, z. B. Patient, Leitung und Arzt an die Pflegekraft. Beim Interrollenkonflikt kollidieren die Anforderungen verschiedener Rollen, z. B. Pflegekraft und Elternteil.",["intrarollen","erwartung","bezugsgruppe","interrollen","kollidieren|verschiedener rollen"]],
["Fall: Der Patient wünscht lange Zuwendung, die Leitung verlangt Zeitersparnis, der Arzt viel Dokumentation. Wie gehst du damit um?","Das ist ein Intrarollenkonflikt. Ich kläre die Erwartungen, setze Prioritäten (Sicherheit und Versorgung zuerst) und spreche das Problem im Team und mit der Leitung an. Ich informiere den Patienten über meine Möglichkeiten und nutze bei Bedarf Supervision.",["intrarollen","prioritat","team|leitung","supervision","klare|klaren|besprech"]]
